# CI: lint, tests, builds and E2E for agent (Rust), server (Go), web (SvelteKit) and protocol (buf).
# All actions are pinned by commit SHA; tool versions are pinned below (updated by Renovate).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=casey/just
  JUST_VERSION: 1.59.0
  # renovate: datasource=github-releases depName=bufbuild/buf
  BUF_VERSION: 1.75.0
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.10.0
  # renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
  # Must be known to the pinned taiki-e/install-action, otherwise it falls back to cargo-binstall.
  CARGO_DENY_VERSION: 0.20.2
  # renovate: datasource=github-releases depName=rust-cross/cargo-zigbuild
  CARGO_ZIGBUILD_VERSION: 0.24.1
  # Updated manually: zig releases are published on ziglang.org, the GitHub tags lag behind. Update
  # ZIG_SHA256_AARCH64 in nightly.yml with it.
  ZIG_VERSION: 0.17.1
  # SHA-256 of zig-x86_64-linux-<version>.tar.xz (from https://ziglang.org/download/index.json).
  ZIG_SHA256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just lint-shell lint-compose test-scripts
      # install.sh (bats) and the systemd unit's exposure score, in a Debian container.
      - run: just test-packaging

  proto:
    name: protocol (buf)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # breaking check compares against origin/main
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just lint-proto
      - run: just breaking-proto origin/main

  generated-code:
    name: generated code up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Cache Rust protoc plugins
        id: proto-plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/protoc-gen-prost
            ~/.cargo/bin/protoc-gen-tonic
          key: protoc-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('justfile') }}
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }}
      - if: steps.proto-plugins.outputs.cache-hit != 'true'
        run: just install-proto-plugins
      - run: just check-gen

  agent:
    name: agent (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (agent/rust-toolchain.toml)
        working-directory: agent
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - run: just lint-agent test-agent security-agent

  agent-release:
    name: agent static release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (agent/rust-toolchain.toml)
        working-directory: agent
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
          key: release
      # zig is installed directly (mlugg/setup-zig still targets the deprecated Node.js 20).
      - name: Cache zig archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-archive
          key: zig-${{ env.ZIG_VERSION }}-x86_64-linux
      - name: Install zig (pinned version, checksum verified on every run)
        run: |
          archive="zig-archive/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          if [ ! -f "$archive" ]; then
            mkdir -p zig-archive
            curl -fsSLo "$archive" "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          fi
          echo "${ZIG_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - run: zig version
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - run: just build-agent
      # .deb, .rpm and .apk with keys of this run: signature, install, upgrade, removal (M2-21).
      - run: just test-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-binaries
          path: |
            agent/target/x86_64-unknown-linux-musl/release/sermon-agent
            agent/target/x86_64-unknown-linux-musl/release/sermon-helper
            agent/target/aarch64-unknown-linux-musl/release/sermon-agent
            agent/target/aarch64-unknown-linux-musl/release/sermon-helper
          if-no-files-found: error
          retention-days: 7

  agent-smoke:
    name: agent smoke test (${{ matrix.arch }} on ${{ matrix.image }})
    needs: agent-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, image: "debian:13-slim" }
          - { arch: amd64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, image: "alpine:3.22" }
          - { arch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, image: "debian:13-slim" }
          - { arch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, image: "alpine:3.22" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-binaries
      - name: Run static binaries natively and inside ${{ matrix.image }}
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          # The artifact keeps the paths below agent/target/; zip loses the executable bit.
          bin="${TARGET}/release"
          chmod +x "$bin"/sermon-agent "$bin"/sermon-helper
          file "$bin"/sermon-agent | grep -q "statically linked"
          "$bin"/sermon-agent --version
          docker run --rm -v "$PWD/$bin:/b:ro" "$IMAGE" sh -c '/b/sermon-agent --version && /b/sermon-helper --version'

  server:
    name: server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - run: just lint-server test-server security-server

  integration:
    name: server integration tests (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just test-integration

  e2e-agent:
    name: agent binary against the real server (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (agent/rust-toolchain.toml)
        working-directory: agent
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
          key: e2e-agent
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just e2e-agent

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: ../scripts/ci-playwright-install.sh
        working-directory: web
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just lint-web test-web security-web
      - name: Build and check bundle budget
        working-directory: web
        run: pnpm run build && pnpm run check:size

  e2e:
    name: e2e (server with embedded UI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: ../scripts/ci-playwright-install.sh
        working-directory: web
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  e2e-demo:
    name: e2e demo (real stack, agents in systemd containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install pinned Rust toolchain (agent/rust-toolchain.toml)
        working-directory: agent
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
          key: release
      - name: Cache zig archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-archive
          key: zig-${{ env.ZIG_VERSION }}-x86_64-linux
      - name: Install zig (pinned version, checksum verified on every run)
        run: |
          archive="zig-archive/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          if [ ! -f "$archive" ]; then
            mkdir -p zig-archive
            curl -fsSLo "$archive" "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          fi
          echo "${ZIG_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: ../scripts/ci-playwright-install.sh
        working-directory: web
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      # Setup, login, token, install.sh with systemd on Debian 12/13, Ubuntu 24.04, Rocky 9, AlmaLinux 10
      # and Fedora 44 and with OpenRC on Alpine, metrics in under 2 minutes, signed packages on three
      # more hosts, tenant isolation, resource budget of the agent (M1-33, M2-19 to M2-21, M2-25).
      # arm64: nightly.yml.
      # Package sources with updates for the agent hosts first: signatures, the expected updates (M4-08).
      - run: just test-e2e-repos
      - run: just e2e-demo
      # The runner's LSM can deny what works on a developer machine (AppArmor on Ubuntu 24.04).
      - name: Show AppArmor denials
        if: failure()
        run: sudo dmesg | grep -i 'apparmor="DENIED"' | tail -n 40 || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-demo
          path: |
            web/test-results/
            web/playwright-report/
            deploy/e2e/.build/server.log
          if-no-files-found: ignore
          retention-days: 7
