[workspace]
resolver = "3"
members = ["crates/*"]
# Fuzz targets need nightly and have their own workspace (just fuzz-agent).
exclude = ["fuzz"]
# sermon-testserver is test support (dev-dependency only); release builds leave it out.
default-members = [
  "crates/sermon-agent",
  "crates/sermon-buffer",
  "crates/sermon-collectors",
  "crates/sermon-core",
  "crates/sermon-helper",
  "crates/sermon-logs",
  "crates/sermon-modules",
  "crates/sermon-security",
  "crates/sermon-transport",
  "crates/sermon-updates",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/pmoscode/SerMon"
publish = false

# Shared dependency versions – crates reference them with `workspace = true`.
# Generated protocol code (crates/sermon-transport/src/gen) must match these versions (just gen).
[workspace.dependencies]
prost = "=0.14.6"
prost-types = "=0.14.6"
tonic = { version = "=0.14.9", default-features = false, features = ["codegen", "channel", "gzip"] }
tonic-prost = "=0.14.9"

anyhow = "=1.0.104"
crc32fast = "=1.5.5"
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
pem = { version = "=4.0.0", default-features = false, features = ["std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "process", "std"] }
rustls-webpki = { version = "=0.103.17", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
clap = { version = "=4.6.8", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive", "env"] }
http = "=1.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Linear-time matching for untrusted log lines (no ReDoS, KONZEPT §10.3, §11).
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "macros", "signal", "time", "sync"] }
tokio-stream = { version = "=0.1.19", default-features = false }
tokio-util = "=0.7.20"
toml = { version = "=1.2.1", default-features = false, features = ["display", "parse", "serde", "std"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

# Test-only
proptest = "=1.12.0"
tempfile = "=3.27.0"
# Time zones of classic log files (M2-20): no bundled tzdb, the agent passes /etc/localtime.
jiff = { version = "=0.2.43", default-features = false, features = ["std"] }

sermon-buffer = { path = "crates/sermon-buffer" }
sermon-collectors = { path = "crates/sermon-collectors" }
sermon-core = { path = "crates/sermon-core" }
sermon-logs = { path = "crates/sermon-logs" }
sermon-security = { path = "crates/sermon-security" }
sermon-testserver = { path = "crates/sermon-testserver" }
sermon-transport = { path = "crates/sermon-transport" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Robustness: no hidden panics in production code (allowed in tests via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Explicit conversions only.
as_conversions = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
# Keep unwinding: modules are isolated with catch_unwind (KONZEPT §15).
panic = "unwind"
