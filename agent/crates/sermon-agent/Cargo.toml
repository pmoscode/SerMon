[package]
name = "sermon-agent"
description = "SerMon agent: collects metrics, logs and security events and streams them to the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `sermon-agent simulate`: virtual nodes for development and load tests (`just simulate`,
# `just e2e-agent`). Never in release builds: it enrolls many identities with one token.
simulate = ["dep:serde_json"]

[dependencies]
rustix.workspace = true
anyhow.workspace = true
clap.workspace = true
http.workspace = true
pem.workspace = true
rustls.workspace = true
sermon-buffer.workspace = true
sermon-collectors.workspace = true
sermon-core.workspace = true
sermon-logs.workspace = true
sermon-security.workspace = true
sermon-helper-proto.workspace = true
prost.workspace = true
regex.workspace = true
prost-types.workspace = true
sermon-transport.workspace = true
sermon-updates.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Only the static release builds: musl's allocator keeps freed memory (M4-32, ADR 0038).
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
rcgen.workspace = true
sermon-testserver.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tonic.workspace = true
tempfile.workspace = true
