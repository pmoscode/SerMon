[package]
name = "sermon-modules"
description = "Built-in integration modules (nginx, PostgreSQL, Redis, ...), disabled by default."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Every module is a feature (ADR 0039); the release builds them all.
default = ["smart"]
# SMART of the disks through the root helper (M5-18).
smart = []
# The module `simulate` for tests and demos (ADR 0039); `sermon-agent`'s feature `simulate`.
simulate = []

[dependencies]
regex.workspace = true
sermon-core.workspace = true
sermon-helper-proto.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt"] }
tokio-util.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt", "test-util"] }
