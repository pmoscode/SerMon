[package]
name = "sermon-modules"
description = "Built-in integration modules (nginx, PostgreSQL, Redis, ...), disabled by default."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Every module is a feature of its name (ADR 0039); the release builds them all.
default = ["apache", "docker", "docker_socket", "http_check", "mysql", "nginx", "postgres", "prometheus", "redis", "smart", "systemd_units", "tcp_check", "tls"]
# Containers of Docker and Podman from cgroup v2 (M5-16).
docker = ["dep:sermon-collectors"]
# Docker over its socket, read only (M5-17).
docker_socket = ["http"]
# MySQL and MariaDB over their own small client (M5-14).
mysql = ["sql"]
# PostgreSQL over its own small client (M5-13).
postgres = ["sql"]
# What the database modules share: connection, TLS, SCRAM (M5-13, M5-14).
sql = ["http", "dep:base64", "dep:ring", "dep:sermon-collectors"]
# SMART of the disks through the root helper (M5-18).
smart = []
# The module `simulate` for tests and demos (ADR 0039); `sermon-agent`'s feature `simulate`.
simulate = []
# The HTTP client of the modules (M5-08).
http = [
  "dep:bytes",
  "dep:http",
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:pem",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:tokio-rustls",
]
apache = ["http"]
http_check = ["http"]
nginx = ["http"]
prometheus = ["http"]
# Redis and Valkey (M5-15); TCP, the socket and TLS as the database modules have them (V1-13).
redis = ["sql"]
systemd_units = []
tcp_check = []
tls = ["http"]

[dependencies]
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
pem = { workspace = true, optional = true }
regex.workspace = true
rustix.workspace = true
ring = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
sermon-collectors = { workspace = true, optional = true }
sermon-core.workspace = true
sermon-helper-proto.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "io-util"] }
tokio-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
rcgen.workspace = true
sermon-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt", "io-util", "test-util"] }
