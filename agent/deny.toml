# cargo-deny configuration – run with `just security-agent`.
# Checks advisories (RustSec), licenses (AGPL-3.0 compatible), banned crates and sources.

[graph]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = true

[output]
feature-depth = 1

[advisories]
# Every ignored advisory needs a reason and an issue/ADR reference.
ignore = []

[licenses]
# Permissive and weak-copyleft licenses compatible with AGPL-3.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
exceptions = []
# The allow list is a policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are AGPL-3.0-only and unpublished.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates have no version; that is not a wildcard.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # TLS only via rustls (KONZEPT §4.1) – no OpenSSL in the static musl binaries.
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
