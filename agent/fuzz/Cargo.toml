# Fuzz targets for the agent's parsers of untrusted input (cargo-fuzz, libFuzzer; KONZEPT §18.5).
# Needs the pinned nightly of rust-toolchain.toml in this directory: `just fuzz-agent`.
[package]
name = "sermon-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
tempfile = "=3.27.0"
sermon-buffer = { path = "../crates/sermon-buffer" }
sermon-collectors = { path = "../crates/sermon-collectors" }
sermon-helper = { path = "../crates/sermon-helper" }
sermon-helper-proto = { path = "../crates/sermon-helper-proto" }
prost = "=0.14.6"
sermon-logs = { path = "../crates/sermon-logs" }
sermon-modules = { path = "../crates/sermon-modules" }
sermon-security = { path = "../crates/sermon-security" }
sermon-updates = { path = "../crates/sermon-updates" }


[[bin]]
name = "proc_parsers"
path = "fuzz_targets/proc_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_line"
path = "fuzz_targets/journal_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "security_parser"
path = "fuzz_targets/security_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redaction"
path = "fuzz_targets/redaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_recovery"
path = "fuzz_targets/wal_recovery.rs"
test = false
doc = false
bench = false

# The workspace lints are not taken over: fuzz targets are test code (expect() on fixtures).
[lints]

[[bin]]
name = "multiline"
path = "fuzz_targets/multiline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "process_parsers"
path = "fuzz_targets/process_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "helper_request"
path = "fuzz_targets/helper_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update_parsers"
path = "fuzz_targets/update_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "helper_parsers"
path = "fuzz_targets/helper_parsers.rs"
test = false
