# SerMon for production (M2-26, KONZEPT §22, guide: docs/admin/installation.md).
#
#   cp env.example .env && $EDITOR .env      domain, ACME and SMTP
#   ./secrets.sh                             database passwords and URLs (never overwritten)
#   ./use-release.sh VERSION                 checks the signature of the release's server image
#                                            and pins its digest in .env (SERMON_IMAGE_DIGEST)
#   docker compose pull
#   docker compose run --rm migrate init --master-keys-file /var/lib/sermon/master_keys
#   docker compose up -d
#
# The server image is the published one (V1-03, V1-04), pinned by digest; it brings the signed
# agent binaries and package repositories of its version (/srv/downloads, /srv/repo). Built from
# the source of this checkout instead: with the overlay source.yaml.
#
# Backup and restore (V1-05, docs/admin/backup.md): the one-shot services "backup" and "restore"
# (profiles, never started by "up").
#
# Database roles (ADR 0007, M2-36): the superuser "postgres" stays in the database container; the
# one-shot service "migrate" applies the migrations as "sermon_owner" (no superuser) before the
# server starts; the server itself connects as "sermon_app" only. The one-shot "backup" reads as
# "sermon_backup" (read-only, BYPASSRLS), "restore" writes as "sermon_owner".
#
# Public: Caddy on 80/443 (web UI, ACME) and the server's mTLS agent port (8443), published directly
# so the server sees the agents' addresses (ADR 0028). The database and Loki are on an internal
# network only.
# Every container is read-only, drops all capabilities and forbids new privileges
# (scripts/check-compose.sh --hardened); every image is pinned by digest.
name: sermon

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

# The server's settings, shared with the one-shot migrate service (config is checked as a whole).
x-server-environment: &server-environment
  SERMON_DATABASE_URL_FILE: /run/secrets/database_url
  SERMON_MASTER_KEYS_FILE: /var/lib/sermon/master_keys
  SERMON_LOG_FORMAT: json
  SERMON_HTTP_ADDR: ":8080"
  SERMON_ALLOWED_ORIGINS: https://${SERMON_DOMAIN:?set SERMON_DOMAIN in .env}
  # Only Caddy may set X-Forwarded-For.
  SERMON_TRUSTED_PROXIES: ${SERMON_PROXY_IP:-172.30.78.10}/32
  SERMON_AGENT_ADDR: ":8443"
  SERMON_AGENT_HOSTNAMES: ${SERMON_DOMAIN}
  # The signed agent binaries and package repositories of the image's version (ADR 0043 §4;
  # install.sh, install.sh --repo, self-update).
  SERMON_AGENT_DOWNLOADS_DIR: /srv/downloads
  SERMON_REPO_DIR: /srv/repo
  SERMON_DATABASE_SIZE_LIMIT: ${SERMON_DATABASE_SIZE_LIMIT:-}
  SERMON_ORG_DELETION_GRACE: ${SERMON_ORG_DELETION_GRACE:-720h}
  SERMON_NODE_DELETION_GRACE: ${SERMON_NODE_DELETION_GRACE:-168h}
  SERMON_ACCOUNT_DELETION_GRACE: ${SERMON_ACCOUNT_DELETION_GRACE:-720h}
  SERMON_AUDIT_RETENTION: ${SERMON_AUDIT_RETENTION:-17520h}
  SERMON_OUTBOUND_ALLOWLIST: ${SERMON_OUTBOUND_ALLOWLIST:-}
  # Logs (ADR 0031): only over the internal network.
  SERMON_LOKI_URL: http://loki:3100
  # Countries of addresses (M3-18, optional): a MaxMind DB file in ./geoip, e.g. DB-IP Lite.
  SERMON_GEOIP_DB_FILE: ${SERMON_GEOIP_DB_FILE:-}
  SERMON_GEOIP_ATTRIBUTION: ${SERMON_GEOIP_ATTRIBUTION:-}
  # Sign-in over OIDC (M3-20, optional): the provider and the client; the secret in
  # secrets/oidc_client_secret.
  SERMON_OIDC_ISSUER: ${SERMON_OIDC_ISSUER:-}
  SERMON_OIDC_CLIENT_ID: ${SERMON_OIDC_CLIENT_ID:-}
  SERMON_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
  SERMON_OIDC_NAME: ${SERMON_OIDC_NAME:-}
  SERMON_OIDC_SCOPES: ${SERMON_OIDC_SCOPES:-}
  SERMON_OIDC_MFA: ${SERMON_OIDC_MFA:-}
  SERMON_OIDC_JIT: ${SERMON_OIDC_JIT:-}
  # Production mode: invitations go out by mail only (M1-39).
  SERMON_SMTP_HOST: ${SERMON_SMTP_HOST:?set SERMON_SMTP_HOST in .env}
  SERMON_SMTP_PORT: ${SERMON_SMTP_PORT:-587}
  SERMON_SMTP_TLS: ${SERMON_SMTP_TLS:-starttls}
  SERMON_SMTP_FROM: ${SERMON_SMTP_FROM:?set SERMON_SMTP_FROM in .env}
  SERMON_SMTP_USERNAME: ${SERMON_SMTP_USERNAME:-}
  SERMON_SMTP_PASSWORD_FILE: /run/secrets/smtp_password

# The published image of a release, by digest only: a tag could be moved (ADR 0043).
x-server-image: &server-image ghcr.io/pmoscode/sermon-server@${SERMON_IMAGE_DIGEST:?set SERMON_IMAGE_DIGEST in .env – ./use-release.sh VERSION checks the image and writes it (any value with source.yaml)}

services:
  postgres:
    <<: *hardened
    image: timescale/timescaledb:2.32.0-pg17@sha256:6a6b7d7a346d7c6be03a310c240706f3bbc6d7adbdf3fbc07823570b34337f5e
    # The entrypoint prepares the data directory as root and then drops to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      # The superuser: only here, for the image's init scripts and administration by hand.
      POSTGRES_USER: postgres
      POSTGRES_DB: sermon
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TIMESCALEDB_TELEMETRY: "off"
    secrets: [postgres_password, postgres_owner_password, postgres_app_password, postgres_backup_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The roles of ADR 0007 (sermon_owner, sermon_definer, sermon_app, sermon_backup); mounted on its own so
      # the image's TimescaleDB init scripts stay in place.
      - ./initdb/010-roles.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    tmpfs: [/var/run/postgresql, /tmp]
    shm_size: 256mb
    networks: [internal]
    healthcheck:
      # Over TCP: during the first initialization a temporary server answers on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sermon"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Applies the migrations as the schema owner and exits; the server waits for it (M2-36). The
  # first installation runs "init" here: docker compose run --rm migrate init --master-keys-file …
  migrate:
    <<: *hardened
    image: *server-image
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *server-environment
      SERMON_DATABASE_MIGRATE_URL_FILE: /run/secrets/database_migrate_url
    secrets: [database_url, database_migrate_url, smtp_password, oidc_client_secret]
    # The same view as the server: its configuration is checked as a whole.
    volumes: [server-state:/var/lib/sermon, ./geoip:/srv/geoip:ro]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  server:
    <<: *hardened
    image: *server-image
    environment: *server-environment
    secrets: [database_url, smtp_password, oidc_client_secret]
    volumes:
      - server-state:/var/lib/sermon
      # The signed agent binaries (ADR 0012) and package repositories (ADR 0036) come with the
      # image. A beta channel next to them (ADR 0036): ./beta:/srv/downloads/beta:ro in an
      # override file (docs/admin/installation.md).
      # A country database for the security dashboard (M3-18), optional.
      - ./geoip:/srv/geoip:ro
    ports: ["${SERMON_AGENT_PORT:-8443}:8443"]
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      # Distroless, without a health check of its own: the server's /readyz reports it.
      loki: { condition: service_started }

  # The backup (V1-05, ADR 0042) of master data, events, the agent CA and the configuration in the
  # database, without raw metrics, encrypted to the public backup keys in secrets/backup_recipients,
  # to stdout:
  #   docker compose run --rm -T backup > backups/sermon-$(date -u +%Y%m%dT%H%MZ).backup
  # It reads as sermon_backup in one snapshot; the master keys bind the file to this instance and
  # are not in it – keep a copy of them apart from the backups.
  backup:
    <<: *hardened
    image: *server-image
    command: ["backup", "--out", "-"]
    restart: "no"
    profiles: [backup]
    environment:
      SERMON_DATABASE_BACKUP_URL_FILE: /run/secrets/database_backup_url
      SERMON_MASTER_KEYS_FILE: /var/lib/sermon/master_keys
      SERMON_BACKUP_RECIPIENTS_FILE: /run/secrets/backup_recipients
      SERMON_LOG_FORMAT: json
    secrets: [database_backup_url, backup_recipients]
    volumes: [server-state:/var/lib/sermon:ro]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  # The restore (V1-05) into a new database while the server is stopped, from stdin:
  #   docker compose run --rm -T restore < backups/….backup
  # As the schema owner. secrets/master_keys (the saved master keys) are installed into the
  # server's volume, secrets/backup_identity is the secret backup key: both only for the restore.
  restore:
    <<: *hardened
    image: *server-image
    command: ["restore", "--in", "-", "--install-master-keys", "/var/lib/sermon/master_keys"]
    restart: "no"
    profiles: [restore]
    environment:
      SERMON_DATABASE_MIGRATE_URL_FILE: /run/secrets/database_migrate_url
      SERMON_MASTER_KEYS_FILE: /run/secrets/master_keys
      SERMON_BACKUP_IDENTITY_FILE: /run/secrets/backup_identity
      SERMON_LOG_FORMAT: json
    secrets: [database_migrate_url, master_keys, backup_identity]
    volumes: [server-state:/var/lib/sermon]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  # Logs (ADR 0031): multi-tenant without a login of its own, so on the internal network only and
  # without a published port; runs as UID 10001 from the image.
  loki:
    <<: *hardened
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]
    # Bounded memory (M3-27): queries over 14 days must not take the host's memory from the
    # database and the server. GOMEMLIMIT lets Go collect before the kernel kills at the limit.
    mem_limit: ${SERMON_LOKI_MEMORY:-1g}
    environment:
      GOMEMLIMIT: ${SERMON_LOKI_GOMEMLIMIT:-900MiB}
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    tmpfs: [/tmp]
    networks: [internal]

  caddy:
    <<: *hardened
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    cap_add: [NET_BIND_SERVICE]
    environment:
      SERMON_DOMAIN: ${SERMON_DOMAIN}
      SERMON_ACME_EMAIL: ${SERMON_ACME_EMAIL:?set SERMON_ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    ports: ["80:80", "443:443", "443:443/udp"]
    networks:
      edge: { ipv4_address: "${SERMON_PROXY_IP:-172.30.78.10}" }
    depends_on: [server]

networks:
  # Caddy and the server: published ports and outgoing connections (ACME, SMTP, channels).
  # Dynamic addresses come from the upper half only, so Caddy's fixed one is never taken.
  edge:
    ipam:
      config:
        - subnet: "${SERMON_EDGE_SUBNET:-172.30.78.0/24}"
          ip_range: "${SERMON_EDGE_IP_RANGE:-172.30.78.128/25}"
  # The database and Loki: no route outside.
  internal:
    internal: true

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  postgres_owner_password: { file: ./secrets/postgres_owner_password }
  postgres_app_password: { file: ./secrets/postgres_app_password }
  postgres_backup_password: { file: ./secrets/postgres_backup_password }
  database_url: { file: ./secrets/database_url }
  database_migrate_url: { file: ./secrets/database_migrate_url }
  # The backup (V1-05): the URL of sermon_backup and the public backup keys (backup-keygen); the
  # saved master keys and the secret backup key only for a restore.
  database_backup_url: { file: ./secrets/database_backup_url }
  backup_recipients: { file: ./secrets/backup_recipients }
  master_keys: { file: ./secrets/master_keys }
  backup_identity: { file: ./secrets/backup_identity }
  smtp_password: { file: ./secrets/smtp_password }
  oidc_client_secret: { file: ./secrets/oidc_client_secret }

volumes:
  postgres-data:
  loki-data:
  server-state:
  caddy-data:
  caddy-config:
