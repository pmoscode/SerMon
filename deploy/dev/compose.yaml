# Development infrastructure – start with `just dev` (or `just dev-infra` for the containers only).
# Images are pinned by digest (updated by Renovate, minimum age 3 days). All ports bind to 127.0.0.1 only.
# No telemetry: TimescaleDB and Loki phone-home features are disabled (KONZEPT §18.6).
name: sermon-dev

services:
  postgres:
    image: timescale/timescaledb:2.32.0-pg17@sha256:6a6b7d7a346d7c6be03a310c240706f3bbc6d7adbdf3fbc07823570b34337f5e
    environment:
      POSTGRES_USER: sermon
      POSTGRES_DB: sermon
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TIMESCALEDB_TELEMETRY: "off"
    secrets: [postgres_password, postgres_owner_password, postgres_app_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only files directly in /docker-entrypoint-initdb.d run (mounted one by one, so the
      # TimescaleDB image's own init scripts stay in place).
      # The same roles as in production (M2-36); just dev migrates as the superuser anyway, so
      # volumes from before keep working.
      - ../compose/initdb/010-roles.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    ports: ["127.0.0.1:${SERMON_DEV_PG_PORT:-55432}:5432"]
    healthcheck:
      # Over TCP: during the image's first initialization a temporary server answers on the socket
      # only and restarts afterwards; a socket check would report it healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sermon -d sermon"]
      interval: 2s
      timeout: 3s
      retries: 30

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:${SERMON_DEV_LOKI_PORT:-3100}:3100"]

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${SERMON_DEV_SMTP_PORT:-1025}:1025" # SMTP for notification tests
      - "127.0.0.1:${SERMON_DEV_MAIL_UI_PORT:-8025}:8025" # web UI and API

  ntfy:
    image: binwiederhier/ntfy:v2.38.0@sha256:771309aecfce18d8fe2bfb8069994ddd6be6ca6ccdd7badace3d791a0045ff0d
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://127.0.0.1:${SERMON_DEV_NTFY_PORT:-8090}
    ports: ["127.0.0.1:${SERMON_DEV_NTFY_PORT:-8090}:80"]

secrets: # generated by scripts/dev-secrets.sh, never committed
  postgres_password: # superuser "sermon": migrations in development
    file: ./.secrets/postgres_password
  postgres_owner_password: # role "sermon_owner": owns the schema (production migrations)
    file: ./.secrets/postgres_owner_password
  postgres_app_password: # role "sermon_app": sermon-server (row-level security applies)
    file: ./.secrets/postgres_app_password

volumes:
  postgres-data:
  loki-data:
