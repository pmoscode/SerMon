# End-to-end environment (M1-33, M2-26): an overlay on the production compose,
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/e2e/compose.yaml
#
# so the demo runs against the real production file – its image built from source, hardening,
# networks and the directly published agent port. The overlay adds Mailpit, Caddy's own CA instead
# of ACME, the agent hosts with systemd and OpenRC, ntfy and a Slack mock for the alerts (M2-27),
# and publishes only on 127.0.0.1.
# Started by scripts/e2e-demo.sh (`just e2e-demo`), which writes the secrets into .build/ and sets
# COMPOSE_FILE and COMPOSE_ENV_FILES (e2e.env).
#
# Paths are relative to deploy/compose: docker compose resolves every file of a merge against the
# directory of the first one.
name: sermon-e2e

x-agent-host: &agent-host
  privileged: true # systemd as PID 1 and the hardened unit need it
  cgroup: host
  volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
  tmpfs: [/run, /run/lock, /tmp]
  stop_signal: SIGRTMIN+3
  networks: [edge]

services:
  server:
    environment:
      # Mailed links point to the first origin, the one the browser of the test uses.
      SERMON_ALLOWED_ORIGINS: https://localhost:${SERMON_E2E_PORT:-18443},https://sermon.test
      # The agents reach the agent port inside the network as server:8443.
      SERMON_AGENT_HOSTNAMES: server
      SERMON_SMTP_CA_FILE: /run/secrets/mailpit_ca
      # Channels inside the network (M2-27): ntfy and the Slack mock have private addresses.
      SERMON_OUTBOUND_ALLOWLIST: ${SERMON_EDGE_SUBNET:-172.30.78.0/24}
      # The Slack mock's certificate is the only root for outgoing HTTPS (Go reads SSL_CERT_FILE).
      SSL_CERT_FILE: /run/secrets/slack_mock_ca
    secrets: [mailpit_ca, slack_mock_ca]
    volumes: ["../e2e/.build/downloads:/srv/downloads:ro"]
    ports: !reset []
    depends_on:
      mailpit: { condition: service_started }

  # The one-shot migration and "init" (M2-36) see the server's downloads as in production.
  migrate:
    volumes: ["../e2e/.build/downloads:/srv/downloads:ro"]

  caddy:
    # tls internal: Caddy's own CA, like a self-hosted server without a public certificate.
    volumes: ["../e2e/Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: !override ["127.0.0.1:${SERMON_E2E_PORT:-18443}:443"]
    networks:
      edge: { aliases: [sermon.test] }

  # Mail server of the run: STARTTLS required, any login accepted; the test reads the invitation
  # mails through its API (published on 127.0.0.1 only).
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_DISABLE_RDNS: "true"
    volumes: ["../e2e/.build/mailpit:/certs:ro"]
    ports: ["127.0.0.1:${SERMON_E2E_MAIL_PORT:-18025}:8025"]
    networks: [edge]

  # ntfy as a self-hosted push server (M2-27); the test reads the messages over its API.
  ntfy:
    image: binwiederhier/ntfy:v2.38.0@sha256:771309aecfce18d8fe2bfb8069994ddd6be6ca6ccdd7badace3d791a0045ff0d
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://ntfy
    ports: ["127.0.0.1:${SERMON_E2E_NTFY_PORT:-18090}:80"]
    networks: [edge]

  # Slack's incoming webhooks (M2-27): the channel only takes https://hooks.slack.com/…, so the
  # mock gets that name in the network and a certificate of this run.
  slack-mock:
    build: { context: ../e2e, dockerfile: slack-mock.Dockerfile }
    environment:
      CERT_FILE: /certs/slack-mock.crt
      KEY_FILE: /certs/slack-mock.key
    volumes: ["../e2e/.build/slack-mock:/certs:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${SERMON_E2E_SLACK_PORT:-18026}:8080"]
    networks:
      edge: { aliases: [hooks.slack.com] }

  # web-01 runs a real sshd (journald); web-02 attacks it with sshpass (M2-27).
  agent-debian-12:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent.Dockerfile, args: { BASE: "debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8", EXTRA_PACKAGES: openssh-server } }
    hostname: web-01
  agent-debian-13:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent.Dockerfile, args: { BASE: "debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6", EXTRA_PACKAGES: openssh-client sshpass } }
    hostname: web-02
  agent-ubuntu-24-04:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent.Dockerfile, args: { BASE: "ubuntu:24.04@sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289" } }
    hostname: db-01
  # The RHEL family and Fedora (M2-19): install.sh, systemd unit and collectors with dnf-based hosts.
  agent-rockylinux-9:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent.Dockerfile, args: { BASE: "rockylinux:9@sha256:03303863808e9cd79f0c58c833db3e5f9cde9f2abe16804a267b05dc54af86e4" } }
    hostname: app-01
  agent-almalinux-10:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent.Dockerfile, args: { BASE: "almalinux:10@sha256:ccf217024b3d5e268cc208d1edb384a1edee6359370cf6ea1ecbc42254e57375" } }
    hostname: app-02
  agent-fedora-44:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent.Dockerfile, args: { BASE: "fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e" } }
    hostname: dev-01
  # Alpine with OpenRC and busybox syslogd, no journald (M2-20): the agent reads /var/log/messages.
  agent-alpine-3-22:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent-alpine.Dockerfile, args: { BASE: "alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f" } }
    hostname: edge-01
    stop_signal: SIGUSR2 # busybox init
  # Fresh hosts for the agent packages (M2-21): .deb, .rpm and .apk from .build/packages.
  pkg-debian-13:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent.Dockerfile, args: { BASE: "debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6" } }
    hostname: pkg-01
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw", "../e2e/.build/packages:/packages:ro"]
  pkg-rockylinux-9:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent.Dockerfile, args: { BASE: "rockylinux:9@sha256:03303863808e9cd79f0c58c833db3e5f9cde9f2abe16804a267b05dc54af86e4" } }
    hostname: pkg-02
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw", "../e2e/.build/packages:/packages:ro"]
  pkg-alpine-3-22:
    <<: *agent-host
    build: { context: ../e2e, dockerfile: agent-alpine.Dockerfile, args: { BASE: "alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f" } }
    hostname: pkg-03
    stop_signal: SIGUSR2 # busybox init
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw", "../e2e/.build/packages:/packages:ro"]

secrets: # written by scripts/e2e-demo.sh into .build/, never committed
  postgres_password: { file: ../e2e/.build/secrets/postgres_password }
  postgres_owner_password: { file: ../e2e/.build/secrets/postgres_owner_password }
  postgres_app_password: { file: ../e2e/.build/secrets/postgres_app_password }
  database_url: { file: ../e2e/.build/secrets/database_url }
  database_migrate_url: { file: ../e2e/.build/secrets/database_migrate_url }
  smtp_password: { file: ../e2e/.build/secrets/smtp_password }
  mailpit_ca: { file: ../e2e/.build/mailpit/mailpit.crt }
  slack_mock_ca: { file: ../e2e/.build/slack-mock/slack-mock.crt }
