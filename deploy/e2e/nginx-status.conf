# nginx on web-01 (M5-11): the stub_status page the module nginx reads, where the discovery
# suggests it (http://127.0.0.1/nginx_status). The listener on 127.0.0.1:80 is more specific
# than the default site's `listen 80`, so it takes the requests to 127.0.0.1 and only those.
server {
    listen 127.0.0.1:80;
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
    location / {
        return 404;
    }
}
