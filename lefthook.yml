# Git hooks – installed via `just setup` (runs `lefthook install`).

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    rustfmt:
      glob: "agent/**/*.rs"
      root: "agent/"
      run: cargo fmt --all -- --check
    gofmt:
      glob: "server/**/*.go"
      root: "server/"
      run: golangci-lint fmt --diff ./...
    buf-format:
      glob: "proto/**/*.proto"
      root: "proto/"
      run: buf format --diff --exit-code
    prettier:
      glob: "web/**/*.{ts,js,svelte,css,json,html}"
      root: "web/"
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

commit-msg:
  commands:
    conventional-commits:
      run: sh scripts/check-commit-msg.sh {1}
