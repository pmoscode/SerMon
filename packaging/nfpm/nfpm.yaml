# Agent packages (M2-21): .deb, .rpm and .apk, built with nfpm by scripts/package-agent.sh, which
# sets PKG_ARCH and PKG_VERSION, writes the name of the apk key for @APK_KEY_NAME@ and fills root/
# and keys/ (paths relative to its work directory).
# The packages install the agent but do not enroll it: the admin sets the server in
# /etc/sermon/agent.toml and enrolls (postinstall says how). Every package is signed; the script
# refuses to build without keys.
name: sermon-agent
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
release: "1"
section: admin
priority: optional
maintainer: SerMon project
vendor: SerMon
homepage: https://github.com/pmoscode/SerMon
license: AGPL-3.0-only
description: |-
  SerMon agent: metrics, logs and security events of this host for sermon-server.
  Runs unprivileged as the user sermon; enroll it with a token from the SerMon UI.
# The root helper is a package of its own (ADR 0035): without it no remote updates or reboots.
recommends:
  - sermon-helper

contents:
  - src: root/sermon-agent
    dst: /usr/bin/sermon-agent
    file_info: { mode: 0755 }
  - src: root/sermon-agent.service
    dst: /usr/lib/systemd/system/sermon-agent.service
    packager: deb
    file_info: { mode: 0644 }
  - src: root/sermon-agent.service
    dst: /usr/lib/systemd/system/sermon-agent.service
    packager: rpm
    file_info: { mode: 0644 }
  - src: root/sermon-agent.openrc
    dst: /etc/init.d/sermon-agent
    packager: apk
    file_info: { mode: 0755 }
  - src: root/agent.toml
    dst: /etc/sermon/agent.toml
    type: config|noreplace
    file_info: { mode: 0640 }
  # The public keys of the package repositories (M4-31, scripts/repo-keys.sh), where install.sh
  # --repo puts them: every update replaces them, so the keys of a rotation reach the host.
  - src: root/repo-keys/sermon.asc
    dst: /usr/share/keyrings/sermon-archive-keyring.asc
    packager: deb
    file_info: { mode: 0644 }
  - src: root/repo-keys/sermon.asc
    dst: /etc/pki/rpm-gpg/RPM-GPG-KEY-sermon
    packager: rpm
    file_info: { mode: 0644 }
  - src: root/repo-keys/sermon-*.rsa.pub
    dst: /etc/apk/keys
    packager: apk
    file_info: { mode: 0644 }

scripts:
  preinstall: root/preinstall.sh
  postinstall: root/postinstall.sh
  preremove: root/preremove.sh
  postremove: root/postremove.sh

deb:
  signature:
    key_file: keys/gpg.asc
    type: origin
rpm:
  signature:
    key_file: keys/gpg.asc
apk:
  scripts:
    postupgrade: root/postinstall.sh
  signature:
    key_file: keys/apk.rsa
    key_name: "@APK_KEY_NAME@"
