# Code generation – run via `just gen` (from the repository root).
# All plugins run locally with pinned versions; no remote plugins (proto files never leave
# the machine). Generated code is committed; CI checks that `just gen` produces no diff.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/pmoscode/SerMon/server/internal/gen
  disable:
    # Dependencies keep their own Go packages (buf.build/gen/go/...).
    - module: buf.build/bufbuild/protovalidate
plugins:
  # Go: messages (google.golang.org/protobuf) and Connect/gRPC handlers. Versions: server/go.mod (tool).
  # The server never talks to the root helper (sermon.helper.v1, ADR 0035).
  - local: ["go", "-C", "../server", "tool", "protoc-gen-go"]
    out: ../server/internal/gen
    exclude_types: [sermon.helper.v1]
    opt: paths=source_relative
  - local: ["go", "-C", "../server", "tool", "protoc-gen-connect-go"]
    out: ../server/internal/gen
    exclude_types: [sermon.helper.v1]
    opt: paths=source_relative

  # TypeScript (Protobuf-ES v2, includes service descriptors for Connect-ES). Version: web/package.json.
  - local: ../web/node_modules/.bin/protoc-gen-es
    out: ../web/src/lib/api/gen
    include_imports: true
    # The UI only talks the web API; validation rules (buf.validate) stay on the server and would
    # bloat the bundle with their descriptors.
    exclude_types: [sermon.agent.v1, sermon.helper.v1, buf.validate]
    opt: target=ts

  # Rust: prost messages and tonic client (agent side only). Versions: just setup / CLAUDE.md.
  - local: protoc-gen-prost
    out: ../agent/crates/sermon-transport/src/gen
    exclude_types: [sermon.web.v1, sermon.helper.v1] # the agent only talks the agent API
    opt:
      - compile_well_known_types
      - extern_path=.google.protobuf=::prost_types
      # The credentials of the modules (ADR 0039): a Debug of our own, without the value (proto.rs).
      - skip_debug=.sermon.agent.v1.ModuleSecret
  - local: protoc-gen-tonic
    out: ../agent/crates/sermon-transport/src/gen
    exclude_types: [sermon.web.v1, sermon.helper.v1]
    opt:
      - no_server=true
      - compile_well_known_types
      - extern_path=.google.protobuf=::prost_types

  # Rust: tonic server stubs for the mock server in agent tests only (dev-dependency, never in the
  # agent binary). Messages come from sermon-transport.
  - local: protoc-gen-tonic
    out: ../agent/crates/sermon-testserver/src/gen
    exclude_types: [sermon.web.v1, sermon.helper.v1]
    opt:
      - no_client=true
      - no_include
      - compile_well_known_types
      - extern_path=.google.protobuf=::prost_types
      - extern_path=.sermon.agent.v1=::sermon_transport::proto::agent::v1

  # Rust: the protocol between agent and root helper (ADR 0035), prost messages only, in a crate of
  # its own that the helper can use without the gRPC stack.
  - local: protoc-gen-prost
    out: ../agent/crates/sermon-helper-proto/src/gen
    types: [sermon.helper.v1]
