syntax = "proto3";

// Package sermon.agent.v1 is the protocol between sermon-agent and sermon-server.
//
// Security rules (KONZEPT §5, §18):
// - The agent always opens the connection; the server reaches agents only through this stream.
// - Organization and node identity are taken exclusively from the agent's mTLS client
//   certificate. Messages from the agent therefore never carry org or node IDs.
// - Server-to-agent messages are typed commands only – there is no generic "exec" payload.
package sermon.agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// AgentService is implemented by sermon-server and called by agents over mTLS.
service AgentService {
  // Session opens the long-lived bidirectional stream of a connected agent. The agent must
  // send a Hello as its first message; the server answers with Ack messages and commands.
  rpc Session(stream SessionRequest) returns (stream SessionResponse);
  // FetchAgentRelease streams a signed agent binary for a self-update (ADR 0036): first its
  // size and minisign signature, then chunks of 256 KiB. Only versions the server knows with a
  // valid signature of the release key; NOT_FOUND otherwise. At most one at a time per node and 10
  // an hour (RESOURCE_EXHAUSTED). The node comes from the certificate.
  rpc FetchAgentRelease(FetchAgentReleaseRequest) returns (stream FetchAgentReleaseResponse);
}

// FetchAgentReleaseRequest names the release.
message FetchAgentReleaseRequest {
  // version is the agent version, as in SelfUpdate.
  string version = 1 [(buf.validate.field).string = {
    max_bytes: 64
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
  }];
  // architecture is the binary's architecture.
  Architecture architecture = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// FetchAgentReleaseResponse is one message of the stream: the header first, then the chunks.
message FetchAgentReleaseResponse {
  // part is the header or a chunk of the binary.
  oneof part {
    // header comes first.
    AgentReleaseHeader header = 1;
    // chunk is the next up to 256 KiB of the binary.
    bytes chunk = 2;
  }
}

// AgentReleaseHeader describes the binary that follows.
message AgentReleaseHeader {
  // size is the binary's size in bytes.
  uint64 size = 1;
  // signature is the minisign signature file (.minisig) of the binary.
  string signature = 2;
}

// SessionRequest is one message from the agent to the server.
message SessionRequest {
  // payload is the actual message; exactly one must be set.
  oneof payload {
    option (buf.validate.oneof).required = true;

    // hello introduces the agent; it must be the first message of a stream.
    Hello hello = 1;
    // heartbeat keeps the stream alive and proves liveness.
    Heartbeat heartbeat = 2;
    // rotate_certificate asks for a new certificate for a fresh key pair (after two thirds of
    // the lifetime, KONZEPT §6). The identity stays the same; it comes from the current
    // certificate of this stream, never from the message.
    RotateCertificate rotate_certificate = 3;
    // batch carries buffered data with its sequence number; the server answers with an Ack once
    // the batch is persisted.
    Batch batch = 4;
    // config_applied answers config_update: the configuration is in use, or why not (ADR 0030).
    ConfigApplied config_applied = 5;
    // process_snapshot is a snapshot of the live view (KONZEPT §9); never buffered, never
    // acknowledged: a lost one is replaced by the next.
    ProcessSnapshot process_snapshot = 6;
    // live_view_refused answers start_live_view when agent.toml forbids the live view.
    LiveViewRefused live_view_refused = 7;
  }
}

// SessionResponse is one message from the server to the agent.
message SessionResponse {
  // payload is the actual message; exactly one must be set.
  oneof payload {
    option (buf.validate.oneof).required = true;

    // ack confirms that all messages up to a sequence number were persisted.
    Ack ack = 1;
    // certificate_issued answers rotate_certificate. The previous certificate stays valid for a
    // short grace period so that the agent can reconnect with the new one.
    CertificateIssued certificate_issued = 2;
    // rotate_now asks the agent to rotate its certificate immediately (on-demand rotation by an
    // operator, KONZEPT §6). The agent answers with rotate_certificate; afterwards the server
    // revokes the previous certificate at once and ends the session.
    RotateNow rotate_now = 3;
    // trust_bundle lists the roots the agent must trust for the agent API; sent at the start of
    // every session. During a CA rollover it contains the old and the new root (KONZEPT §6).
    TrustBundle trust_bundle = 4;
    // throttle asks the agent to send batches more slowly (quota exceeded, KONZEPT §5).
    Throttle throttle = 5;
    // config_update is the configuration the server holds for the node (ADR 0030); sent when its
    // version differs from the agent's and after every change.
    ConfigUpdate config_update = 6;
    // start_live_view starts the live view or renews its lease (KONZEPT §9).
    StartLiveView start_live_view = 7;
    // stop_live_view ends the live view.
    StopLiveView stop_live_view = 8;
    // refresh_update_info asks for a new UpdateReport now (KONZEPT §14.1); the agent does it at
    // most every 5 minutes.
    RefreshUpdateInfo refresh_update_info = 9;
    // run_update installs updates through the root helper (KONZEPT §14.2, ADR 0035).
    RunUpdate run_update = 10;
    // reboot_node reboots the host through the root helper.
    RebootNode reboot_node = 11;
    // self_update replaces the agent's binary through the root helper (KONZEPT §14.3).
    SelfUpdate self_update = 12;
  }
}

// Hello is the first message of every stream.
message Hello {
  // protocol_version is the agent's protocol version; the server supports N and N-1.
  uint32 protocol_version = 1 [(buf.validate.field).uint32.gte = 1];
  // agent_version is the semantic version of the agent binary, e.g. "1.4.2".
  string agent_version = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // host_facts describe the machine the agent runs on.
  HostFacts host_facts = 3 [(buf.validate.field).required = true];
  // config_version is the version of the server-provided configuration the agent currently
  // applies (0 = none yet); the server sends a newer one if available.
  uint64 config_version = 4;
  // install_method is how the agent was installed, from the path of its binary (ADR 0036):
  // only script installations update themselves.
  InstallMethod install_method = 5 [(buf.validate.field).enum.defined_only = true];
}

// InstallMethod is how the agent was installed.
enum InstallMethod {
  // INSTALL_METHOD_UNSPECIFIED: not reported (older agents) or elsewhere.
  INSTALL_METHOD_UNSPECIFIED = 0;
  // INSTALL_METHOD_SCRIPT: install.sh, /usr/local/bin/sermon-agent.
  INSTALL_METHOD_SCRIPT = 1;
  // INSTALL_METHOD_PACKAGE: a package, /usr/bin/sermon-agent.
  INSTALL_METHOD_PACKAGE = 2;
}

// HostFacts are static properties of the monitored host.
message HostFacts {
  // hostname is the host's name as reported by the kernel (RFC 1123, max. 253 characters).
  string hostname = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
  }];
  // machine_id is the content of /etc/machine-id: 32 lowercase hex characters.
  string machine_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{32}$"];
  // os_id is the ID from /etc/os-release, e.g. "debian", "rocky", "alpine".
  string os_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // os_version is the VERSION_ID from /etc/os-release, e.g. "13" or "9.5".
  string os_version = 4 [(buf.validate.field).string.max_len = 64];
  // kernel_release is the output of `uname -r`.
  string kernel_release = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // architecture is the CPU architecture of the agent binary.
  Architecture architecture = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // cpu_count is the number of logical CPUs.
  uint32 cpu_count = 7 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 4096
  }];
  // memory_bytes is the total physical memory in bytes.
  uint64 memory_bytes = 8 [(buf.validate.field).uint64.gt = 0];
  // security_source is where the agent reads security events from (M2-31); unspecified from
  // agents before it.
  SecuritySource security_source = 9 [(buf.validate.field).enum.defined_only = true];
}

// SecuritySource is where the agent finds the log lines for security events (ADR 0025).
enum SecuritySource {
  // SECURITY_SOURCE_UNSPECIFIED: not reported (older agents).
  SECURITY_SOURCE_UNSPECIFIED = 0;
  // SECURITY_SOURCE_JOURNAL is the systemd journal: every line carries its sender.
  SECURITY_SOURCE_JOURNAL = 1;
  // SECURITY_SOURCE_FILE_VERIFIED is the file of the SerMon rsyslog template, with the sender's
  // user ID on every line.
  SECURITY_SOURCE_FILE_VERIFIED = 2;
  // SECURITY_SOURCE_FILE_UNVERIFIED is a classic log file (auth.log, secure, messages): its
  // events count but are marked unverified.
  SECURITY_SOURCE_FILE_UNVERIFIED = 3;
  // SECURITY_SOURCE_NONE: no journald and no readable log file, so no security events.
  SECURITY_SOURCE_NONE = 4;
}

// Architecture is a supported CPU architecture.
enum Architecture {
  // ARCHITECTURE_UNSPECIFIED is invalid and must not be sent.
  ARCHITECTURE_UNSPECIFIED = 0;
  // ARCHITECTURE_AMD64 is x86-64.
  ARCHITECTURE_AMD64 = 1;
  // ARCHITECTURE_ARM64 is AArch64.
  ARCHITECTURE_ARM64 = 2;
}

// Heartbeat proves that the agent is alive; sent every 15 seconds.
message Heartbeat {
  // sent_at is the agent's wall-clock time when the heartbeat was sent (detects clock skew).
  google.protobuf.Timestamp sent_at = 1 [(buf.validate.field).required = true];
}

// RotateCertificate carries the CSR for the agent's new key pair.
message RotateCertificate {
  // csr is a PKCS#10 request in DER for a new ECDSA P-256 key; only the public key is used.
  bytes csr = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 4096
  }];
}

// CertificateIssued is the agent's new client certificate.
message CertificateIssued {
  // certificate is the new client certificate (DER).
  bytes certificate = 1;
  // intermediates are the issuing CA certificates (DER).
  repeated bytes intermediates = 2;
  // not_after is when the new certificate expires.
  google.protobuf.Timestamp not_after = 3;
  // previous_valid_until is when the previous certificate stops working.
  google.protobuf.Timestamp previous_valid_until = 4;
}

// TrustBundle is the set of trusted agent CA roots.
message TrustBundle {
  // roots are root certificates (DER); the agent replaces its stored set with this one.
  repeated bytes roots = 1;
}

// RotateNow has no fields.
message RotateNow {}

// Ack confirms persisted agent data; the agent may then drop it from its buffer.
message Ack {
  // seq is the highest sequence number that was persisted (inclusive).
  uint64 seq = 1;
}

// Batch is one entry of the agent's write-ahead log. After a reconnect the agent sends every batch
// that was not acknowledged yet, so batches may arrive twice: the server drops every batch whose
// seq is not above the highest seq it has persisted for the node. Sequence numbers increase, also
// across agent restarts, but may have gaps where the agent dropped data (buffer limits).
message Batch {
  // seq is the sequence number from the agent's write-ahead log.
  uint64 seq = 1 [(buf.validate.field).uint64.gt = 0];
  // content is the data; exactly one must be set.
  oneof content {
    option (buf.validate.oneof).required = true;

    // metrics are the samples of one collection tick.
    MetricBatch metrics = 2;
    // security_events are events parsed from the host's logs (KONZEPT §11).
    SecurityEventBatch security_events = 3;
    // logs are log entries of the host, redacted by the agent before sending (KONZEPT §10).
    LogBatch logs = 4;
    // update_report lists the host's available updates (KONZEPT §14.1); the newest one counts.
    UpdateReport update_report = 5;
    // command_result says how a command of the server went (run_update, reboot_node,
    // self_update): buffered like all batches, so it survives a restart of the agent – also the
    // one its own update causes. Sent more than once for a run: once per phase.
    CommandResult command_result = 6;
  }
}

// MetricBatch holds the samples of one collection tick (KONZEPT §8). Counters are already
// converted to per-second rates by the agent; every sample is a gauge.
message MetricBatch {
  // collected_at is the agent's wall-clock time of the tick.
  google.protobuf.Timestamp collected_at = 1 [(buf.validate.field).required = true];
  // samples are the values; at most the per-node series limit (KONZEPT §8).
  repeated Sample samples = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2000
  }];
}

// Sample is one value of one series. Organization and node are not part of it: the server takes
// them from the client certificate.
message Sample {
  // metric is the metric name, e.g. "sermon_cpu_utilization_ratio".
  string metric = 1 [(buf.validate.field).string.pattern = "^sermon_[a-z0-9_]{1,120}$"];
  // labels are the bounded, technical labels of the series, e.g. cpu, device, interface,
  // mountpoint, mode.
  map<string, string> labels = 2 [(buf.validate.field).map = {
    max_pairs: 8
    keys: {
      string: {pattern: "^[a-z][a-z0-9_]{0,31}$"}
    }
    values: {
      string: {max_len: 256}
    }
  }];
  // value is the measured value; integers in base units are preferred (bytes/s, counts, ppm).
  oneof value {
    option (buf.validate.oneof).required = true;

    // int_value is an integer value.
    int64 int_value = 3;
    // double_value is a fractional value; NaN and infinity are not allowed.
    double double_value = 4 [(buf.validate.field).double.finite = true];
  }
}

// Throttle limits how fast the agent sends batches. It applies until the next Throttle.
message Throttle {
  // min_interval is the shortest time between two batches; zero lifts the limit.
  google.protobuf.Duration min_interval = 1 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 3600}
  }];
}

// SecurityEventBatch holds security events the agent parsed from the host's logs (KONZEPT §11).
// They are sent even when log shipping is off.
message SecurityEventBatch {
  // events are in the order of the log.
  repeated SecurityEvent events = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 500
  }];
}

// SecurityEvent is one event. Raw log lines are never part of it; fields an attacker can choose
// (user names of failed logins, process names) are bounded.
message SecurityEvent {
  // occurred_at is the time from the log line, not the time of sending.
  google.protobuf.Timestamp occurred_at = 1 [(buf.validate.field).required = true];
  // event is what happened; exactly one must be set.
  oneof event {
    option (buf.validate.oneof).required = true;

    // ssh_login_failed is ssh.login.failed.
    SshLoginFailed ssh_login_failed = 2;
    // ssh_invalid_user is ssh.login.invalid_user.
    SshInvalidUser ssh_invalid_user = 3;
    // ssh_login_succeeded is ssh.login.success.
    SshLoginSucceeded ssh_login_succeeded = 4;
    // ssh_preauth_disconnect is ssh.preauth.disconnect.
    SshPreauthDisconnect ssh_preauth_disconnect = 5;
    // sudo_auth_failed is sudo.auth.failed.
    SudoAuthFailed sudo_auth_failed = 6;
    // sudo_not_allowed is sudo.not_allowed.
    SudoNotAllowed sudo_not_allowed = 7;
    // sudo_command is sudo.command (off unless configured).
    SudoCommand sudo_command = 8;
    // account_created is account.created.
    AccountCreated account_created = 9;
    // account_deleted is account.deleted.
    AccountDeleted account_deleted = 10;
    // system_reboot is system.reboot.
    SystemReboot system_reboot = 11;
    // oom_kill is system.oom_kill.
    OomKill oom_kill = 12;
  }
  // unverified is set for events from classic log files whose sender is unknown or a normal user
  // (ADR 0025): anyone on the host could have written the line. Events from the journal, and from
  // the SerMon rsyslog template with root as sender, leave it false; so do older agents, which
  // read only the journal.
  bool unverified = 13;
}

// SshAuthMethod is how an SSH login was tried.
enum SshAuthMethod {
  // SSH_AUTH_METHOD_UNSPECIFIED is not sent; newer values decode as this in older servers.
  SSH_AUTH_METHOD_UNSPECIFIED = 0;
  // SSH_AUTH_METHOD_PASSWORD is "password".
  SSH_AUTH_METHOD_PASSWORD = 1;
  // SSH_AUTH_METHOD_PUBLICKEY is "publickey".
  SSH_AUTH_METHOD_PUBLICKEY = 2;
  // SSH_AUTH_METHOD_KEYBOARD_INTERACTIVE is "keyboard-interactive", usually PAM.
  SSH_AUTH_METHOD_KEYBOARD_INTERACTIVE = 3;
  // SSH_AUTH_METHOD_HOSTBASED is "hostbased".
  SSH_AUTH_METHOD_HOSTBASED = 4;
  // SSH_AUTH_METHOD_GSSAPI is any "gssapi-*" method.
  SSH_AUTH_METHOD_GSSAPI = 5;
  // SSH_AUTH_METHOD_NONE is "none".
  SSH_AUTH_METHOD_NONE = 6;
  // SSH_AUTH_METHOD_OTHER is any other method.
  SSH_AUTH_METHOD_OTHER = 7;
}

// SshRemote is the other end of an SSH connection as sshd logged it.
message SshRemote {
  // address is an IP address or, where sshd resolves names (UseDNS), a host name.
  oneof address {
    option (buf.validate.oneof).required = true;

    // ip is an IPv4 or IPv6 address.
    string ip = 1 [(buf.validate.field).string.ip = true];
    // host is a host name.
    string host = 2 [(buf.validate.field).string.hostname = true];
  }
  // port is the remote port; 0 where the log does not tell.
  uint32 port = 3 [(buf.validate.field).uint32.lte = 65535];
}

// SshLoginFailed is a failed SSH login.
message SshLoginFailed {
  // user is the user name tried, chosen by the client.
  string user = 1 [(buf.validate.field).string.max_bytes = 128];
  // remote is where the attempt came from.
  SshRemote remote = 2 [(buf.validate.field).required = true];
  // method is how the login was tried.
  SshAuthMethod method = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // invalid_user is set if the user does not exist.
  bool invalid_user = 4;
}

// SshInvalidUser is an SSH connection for a user that does not exist.
message SshInvalidUser {
  // user is the user name tried, chosen by the client.
  string user = 1 [(buf.validate.field).string.max_bytes = 128];
  // remote is where the attempt came from.
  SshRemote remote = 2 [(buf.validate.field).required = true];
}

// SshLoginSucceeded is a successful SSH login.
message SshLoginSucceeded {
  // user is the account logged in to.
  string user = 1 [(buf.validate.field).string.max_bytes = 128];
  // remote is where the login came from.
  SshRemote remote = 2 [(buf.validate.field).required = true];
  // method is how the user authenticated.
  SshAuthMethod method = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // key_type is the type of the public key, e.g. ED25519 (publickey only).
  string key_type = 4 [(buf.validate.field).string.max_bytes = 128];
  // key_fingerprint is the fingerprint of the public key, e.g. SHA256:… (publickey only).
  string key_fingerprint = 5 [(buf.validate.field).string.max_bytes = 128];
}

// SshPreauthDisconnect is an SSH connection that ended before a login.
message SshPreauthDisconnect {
  // user is the user name tried, if any.
  optional string user = 1 [(buf.validate.field).string.max_bytes = 128];
  // remote is where the connection came from.
  SshRemote remote = 2 [(buf.validate.field).required = true];
  // invalid_user is set if the user does not exist.
  bool invalid_user = 3;
}

// SudoAuthFailed is a wrong password for sudo.
message SudoAuthFailed {
  // user is the account whose password failed.
  string user = 1 [(buf.validate.field).string.max_bytes = 128];
  // tty is the terminal, empty if none.
  string tty = 2 [(buf.validate.field).string.max_bytes = 128];
}

// SudoNotAllowed is sudo refusing a user: not in sudoers, or the command is not allowed.
message SudoNotAllowed {
  // user is who ran sudo.
  string user = 1 [(buf.validate.field).string.max_bytes = 128];
  // target is the account asked for, e.g. root.
  string target = 2 [(buf.validate.field).string.max_bytes = 128];
  // tty is the terminal, empty if none.
  string tty = 3 [(buf.validate.field).string.max_bytes = 128];
}

// SudoCommand is a command run through sudo (only if the organization switches it on).
message SudoCommand {
  // user is who ran sudo.
  string user = 1 [(buf.validate.field).string.max_bytes = 128];
  // target is the account the command ran as.
  string target = 2 [(buf.validate.field).string.max_bytes = 128];
  // tty is the terminal, empty if none.
  string tty = 3 [(buf.validate.field).string.max_bytes = 128];
  // command is the command line with secrets redacted by the agent.
  string command = 4 [(buf.validate.field).string.max_bytes = 1024];
}

// AccountCreated is a new local user account.
message AccountCreated {
  // user is the new account.
  string user = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 128
  }];
  // uid is its user ID, if logged.
  optional uint32 uid = 2;
}

// AccountDeleted is a removed local user account.
message AccountDeleted {
  // user is the removed account.
  string user = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 128
  }];
}

// SystemReboot is a new boot of the host, seen from a change of the journal's boot ID.
message SystemReboot {
  // previous_boot_id is the boot ID before.
  string previous_boot_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 128
  }];
  // uptime_before is how long the previous boot ran as far as its last log line tells.
  google.protobuf.Duration uptime_before = 2 [(buf.validate.field).duration.gte = {}];
}

// OomKill is a process killed by the kernel's out-of-memory killer.
message OomKill {
  // pid is the killed process.
  uint32 pid = 1 [(buf.validate.field).uint32.gt = 0];
  // process is its name (at most 15 characters, chosen by whoever started it).
  string process = 2 [(buf.validate.field).string.max_bytes = 64];
}

// LogBatch holds log entries of the host (KONZEPT §10.2), redacted by the agent. The agent sends
// them only while the server's configuration asks for logs (M3-03), so an older server never
// gets one. It bounds a batch to about 256 KiB of messages; the server checks that too (M3-07).
message LogBatch {
  // entries are in the order the agent read them.
  repeated LogEntry entries = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
  }];
}

// LogEntry is one normalized log entry: {ts, source, unit/file, severity, message, fields}. Every
// text comes from the host and is shown as text only; none of it decides anything.
message LogEntry {
  option (buf.validate.message).cel = {
    id: "file"
    message: "file must be an absolute path for entries from a file and empty otherwise"
    expression: "this.source == 2 ? this.file.startsWith('/') : this.file == ''"
  };

  // occurred_at is the time of the entry on the host (journal: __REALTIME_TIMESTAMP).
  google.protobuf.Timestamp occurred_at = 1 [(buf.validate.field).required = true];
  // source is where the entry was read.
  LogSource source = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // unit is the systemd unit (_SYSTEMD_UNIT) or, without one, the syslog identifier; empty if
  // neither is known. The server bounds how many distinct units a node may have.
  string unit = 3 [(buf.validate.field).string.max_bytes = 256];
  // file is the path of the log file (source LOG_SOURCE_FILE only).
  string file = 4 [(buf.validate.field).string.max_bytes = 4096];
  // severity is the syslog priority; unspecified where the source has none.
  LogSeverity severity = 5 [(buf.validate.field).enum.defined_only = true];
  // message is the text, after redaction, cut to 16 KiB.
  string message = 6 [(buf.validate.field).string.max_bytes = 16384];
  // truncated is set if the message was longer and has been cut.
  bool truncated = 7;
  // identifier is the syslog identifier (SYSLOG_IDENTIFIER or the tag of a file line), e.g. sshd.
  string identifier = 8 [(buf.validate.field).string.max_bytes = 256];
  // pid is the sending process; 0 if unknown.
  uint32 pid = 9;
  // process is the name of the sending process (journal: _COMM).
  string process = 10 [(buf.validate.field).string.max_bytes = 256];
  // uid is the user ID of the sender as journald or the SerMon rsyslog template saw it.
  optional uint32 uid = 11;
  // boot_id is the boot the entry belongs to (journal: _BOOT_ID); empty if unknown.
  string boot_id = 12 [(buf.validate.field).string.pattern = "^([0-9a-f]{32})?$"];
  // transport is how journald received the entry (journal, syslog, stdout, kernel, …).
  string transport = 13 [(buf.validate.field).string.pattern = "^[a-z_-]{0,32}$"];
  // facility is the syslog facility (0 kern … 23 local7), if known.
  optional uint32 facility = 14 [(buf.validate.field).uint32.lte = 23];
}

// LogSource is where a log entry comes from (KONZEPT §10.1).
enum LogSource {
  // LOG_SOURCE_UNSPECIFIED is invalid and must not be sent.
  LOG_SOURCE_UNSPECIFIED = 0;
  // LOG_SOURCE_JOURNAL is the systemd journal.
  LOG_SOURCE_JOURNAL = 1;
  // LOG_SOURCE_FILE is a log file (classic syslog files, configured globs).
  LOG_SOURCE_FILE = 2;
}

// LogSeverity is the syslog priority of an entry, from the most to the least severe.
enum LogSeverity {
  // LOG_SEVERITY_UNSPECIFIED: the source does not tell.
  LOG_SEVERITY_UNSPECIFIED = 0;
  // LOG_SEVERITY_EMERGENCY is priority 0: the system is unusable.
  LOG_SEVERITY_EMERGENCY = 1;
  // LOG_SEVERITY_ALERT is priority 1: act immediately.
  LOG_SEVERITY_ALERT = 2;
  // LOG_SEVERITY_CRITICAL is priority 2.
  LOG_SEVERITY_CRITICAL = 3;
  // LOG_SEVERITY_ERROR is priority 3.
  LOG_SEVERITY_ERROR = 4;
  // LOG_SEVERITY_WARNING is priority 4.
  LOG_SEVERITY_WARNING = 5;
  // LOG_SEVERITY_NOTICE is priority 5.
  LOG_SEVERITY_NOTICE = 6;
  // LOG_SEVERITY_INFO is priority 6.
  LOG_SEVERITY_INFO = 7;
  // LOG_SEVERITY_DEBUG is priority 7.
  LOG_SEVERITY_DEBUG = 8;
}

// ConfigUpdate is the configuration of a node (ADR 0030): what to send, nothing about how the
// agent runs. The local veto in agent.toml always wins.
message ConfigUpdate {
  // version identifies the configuration; the agent reports it in Hello and ConfigApplied.
  uint64 version = 1 [(buf.validate.field).uint64.gt = 0];
  // config is the content.
  AgentConfig config = 2 [(buf.validate.field).required = true];
}

// AgentConfig is what the server may set on a node.
message AgentConfig {
  // logs selects the log entries to send (KONZEPT §10).
  LogConfig logs = 1 [(buf.validate.field).required = true];
  // redaction_rules are the organization's rules on top of the built-in ones (KONZEPT §10.3).
  repeated RedactionRule redaction_rules = 2 [(buf.validate.field).repeated.max_items = 32];
}

// LogConfig selects the log entries of a node.
message LogConfig {
  // enabled sends log entries at all; security events are sent either way.
  bool enabled = 1;
  // min_severity drops entries less severe than this; unspecified keeps all, entries without a
  // severity are always kept.
  LogSeverity min_severity = 2 [(buf.validate.field).enum.defined_only = true];
  // exclude_units are systemd units (or syslog identifiers) whose entries are not sent.
  repeated string exclude_units = 3 [(buf.validate.field).repeated = {
    max_items: 64
    items: {
      string: {pattern: "^[A-Za-z0-9@:._\\\\-]{1,256}$"}
    }
  }];
  // files are log files to follow besides the journal (M3-05); the agent reads only paths below
  // its locally allowed prefixes.
  repeated LogFileGlob files = 4 [(buf.validate.field).repeated.max_items = 16];
}

// LogFileGlob is a set of log files.
message LogFileGlob {
  option (buf.validate.message).cel = {
    id: "no_parent"
    message: "pattern must not contain .. segments"
    expression: "!this.pattern.contains('/../') && !this.pattern.endsWith('/..')"
  };

  // pattern is an absolute path with * and ? in the last segments, e.g. /var/log/nginx/*.log.
  string pattern = 1 [(buf.validate.field).string = {
    min_len: 2
    max_bytes: 1024
    pattern: "^/[^\\x00]*$"
  }];
  // multiline_start is a regex for the first line of an entry; following lines that don't match
  // belong to it (e.g. stack traces). Empty: every line is an entry.
  string multiline_start = 2 [(buf.validate.field).string.max_bytes = 1024];
}

// RedactionRule is a rule of the organization (KONZEPT §10.3).
message RedactionRule {
  // pattern is a regex; matches (or their group named secret) are replaced with ***.
  string pattern = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 1024
  }];
}

// ConfigApplied is the agent's answer to a ConfigUpdate.
message ConfigApplied {
  // version is the version of the ConfigUpdate answered.
  uint64 version = 1 [(buf.validate.field).uint64.gt = 0];
  // error says why the agent keeps its previous configuration; empty if it took the new one.
  string error = 2 [(buf.validate.field).string.max_bytes = 1024];
  // logs_vetoed is set if agent.toml forbids sending logs (allow_logs = false).
  bool logs_vetoed = 3;
}

// StartLiveView starts the live view ("top", KONZEPT §9, M3-13): a ProcessSnapshot every
// interval. It is a lease: the agent stops 60 s after the last StartLiveView, at a StopLiveView
// or with the session. A StartLiveView while running renews it and takes the new settings.
message StartLiveView {
  // interval is the time between two snapshots, 1 to 10 s.
  google.protobuf.Duration interval = 1 [(buf.validate.field).duration = {
    gte: {seconds: 1}
    lte: {seconds: 10}
  }];
  // hide_cmdline leaves out the command lines (the organization's switch).
  bool hide_cmdline = 2;
}

// StopLiveView ends the live view.
message StopLiveView {}

// LiveViewRefused says why the agent does not start the live view.
message LiveViewRefused {
  // reason is for the people who asked, e.g. "agent.toml forbids the live view".
  string reason = 1 [(buf.validate.field).string.max_bytes = 256];
}

// ProcessSnapshot is the state of the host's processes at one moment; nothing of it is stored.
message ProcessSnapshot {
  // taken_at is the agent's time of the snapshot.
  google.protobuf.Timestamp taken_at = 1 [(buf.validate.field).required = true];
  // summary is the header (CPU, memory, swap, load, uptime, tasks).
  SystemSummary summary = 2 [(buf.validate.field).required = true];
  // processes are the busiest processes first, at most 4000.
  repeated ProcessInfo processes = 3 [(buf.validate.field).repeated.max_items = 4000];
  // omitted counts the processes left out over the bound.
  uint32 omitted = 4;
}

// SystemSummary is the header of a snapshot, like top's.
message SystemSummary {
  // cpu_busy_ratio is the busy share of all CPUs over the interval; unset in the first snapshot.
  optional double cpu_busy_ratio = 1 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  // cpu_count is the number of CPUs.
  uint32 cpu_count = 2 [(buf.validate.field).uint32.lte = 4096];
  // memory_total_bytes is the physical memory.
  uint64 memory_total_bytes = 3;
  // memory_available_bytes is the memory available without swapping.
  uint64 memory_available_bytes = 4;
  // swap_total_bytes is the swap space.
  uint64 swap_total_bytes = 5;
  // swap_free_bytes is the unused swap space.
  uint64 swap_free_bytes = 6;
  // load_1, load_5 and load_15 are the load averages, if readable.
  optional double load_1 = 7 [(buf.validate.field).double = {
    gte: 0
    lte: 1e6
  }];
  // load_5 is the load over 5 minutes.
  optional double load_5 = 8 [(buf.validate.field).double = {
    gte: 0
    lte: 1e6
  }];
  // load_15 is the load over 15 minutes.
  optional double load_15 = 9 [(buf.validate.field).double = {
    gte: 0
    lte: 1e6
  }];
  // uptime_seconds is the time since boot, if readable.
  optional uint64 uptime_seconds = 10;
  // tasks counts the processes per state.
  TaskCounts tasks = 11;
}

// TaskCounts are the processes per state.
message TaskCounts {
  // total is every process.
  uint32 total = 1;
  // running is state R.
  uint32 running = 2;
  // sleeping is states S, D and I.
  uint32 sleeping = 3;
  // stopped is states T and t.
  uint32 stopped = 4;
  // zombie is state Z.
  uint32 zombie = 5;
}

// ProcessInfo is one process. Every text comes from the host: shown as text only. Unset fields
// were not readable ("n/a").
message ProcessInfo {
  // pid is the process ID.
  uint32 pid = 1 [(buf.validate.field).uint32.gt = 0];
  // ppid is the parent's ID (0 for the first processes).
  uint32 ppid = 2;
  // uid is the real user ID.
  optional uint32 uid = 3;
  // user is the name of uid from /etc/passwd; empty without one.
  string user = 4 [(buf.validate.field).string.max_bytes = 64];
  // state is the one-letter state (R, S, D, Z, T, I, …).
  string state = 5 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4
  }];
  // cpu_ratio is the CPU share of one core over the interval (above 1 with several threads);
  // unset in the first snapshot of the process.
  optional double cpu_ratio = 6 [(buf.validate.field).double = {
    gte: 0
    lte: 4096
  }];
  // rss_bytes is the resident memory.
  optional uint64 rss_bytes = 7;
  // memory_ratio is rss_bytes of the physical memory.
  optional double memory_ratio = 8 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  // threads is the number of threads.
  uint32 threads = 9;
  // runtime_seconds is the time since the start of the process.
  optional uint64 runtime_seconds = 10;
  // name is the process name (comm, at most 15 bytes from the kernel).
  string name = 11 [(buf.validate.field).string.max_bytes = 64];
  // cmdline is the command line, redacted by the agent and cut; unset if hidden or not
  // readable, empty for kernel threads and zombies.
  optional string cmdline = 12 [(buf.validate.field).string.max_bytes = 1024];
  // cmdline_truncated is set if the agent cut the command line.
  bool cmdline_truncated = 13;
  // cmdline_hidden is set if the organization hides command lines.
  bool cmdline_hidden = 14;
  // kernel_thread marks threads of the kernel.
  bool kernel_thread = 15;
  // unit is the systemd unit from the cgroup.
  string unit = 16 [(buf.validate.field).string.max_bytes = 256];
  // container is the first 12 characters of a container ID from the cgroup.
  string container = 17 [(buf.validate.field).string.pattern = "^([0-9a-f]{12})?$"];
}

// RefreshUpdateInfo asks the agent to list its updates now, the package sources refreshed first.
message RefreshUpdateInfo {}

// UpdateScope says which updates a run installs (KONZEPT §14.2).
enum UpdateScope {
  // UPDATE_SCOPE_UNSPECIFIED is invalid.
  UPDATE_SCOPE_UNSPECIFIED = 0;
  // UPDATE_SCOPE_SECURITY installs security updates only (not on Alpine, KONZEPT O6).
  UPDATE_SCOPE_SECURITY = 1;
  // UPDATE_SCOPE_ALL installs all updates.
  UPDATE_SCOPE_ALL = 2;
}

// RunUpdate installs updates. Rebooting afterwards is a command of its own (RebootNode).
message RunUpdate {
  // run_id names the run, chosen by the server: a lowercase UUID; the agent runs it once.
  string run_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"];
  // scope is which updates to install.
  UpdateScope scope = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// RebootNode reboots the host one minute after the root helper took it.
message RebootNode {
  // run_id names the run, chosen by the server: a lowercase UUID; the agent runs it once.
  string run_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"];
  // reason is shown to the host's users and written to its journal, e.g. "updates (SerMon)".
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 200
    pattern: "^[^\\x00-\\x1f\\x7f]*$"
  }];
}

// SelfUpdate replaces the agent's binary with a signed version (KONZEPT §14.3); how the agent
// fetches and the helper checks it follows ADR 0036.
message SelfUpdate {
  // run_id names the run, chosen by the server: a lowercase UUID; the agent runs it once.
  string run_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"];
  // version is the agent version to install, e.g. "0.5.0".
  string version = 2 [(buf.validate.field).string = {
    max_bytes: 64
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
  }];
}

// PackageManager is the host's package manager.
enum PackageManager {
  // PACKAGE_MANAGER_UNSPECIFIED: unknown (see the report's availability).
  PACKAGE_MANAGER_UNSPECIFIED = 0;
  // PACKAGE_MANAGER_APT: Debian and Ubuntu.
  PACKAGE_MANAGER_APT = 1;
  // PACKAGE_MANAGER_DNF: the RHEL family and Fedora.
  PACKAGE_MANAGER_DNF = 2;
  // PACKAGE_MANAGER_APK: Alpine, without security metadata (KONZEPT O6).
  PACKAGE_MANAGER_APK = 3;
}

// UpdateAvailability says whether the agent could list the updates.
enum UpdateAvailability {
  // UPDATE_AVAILABILITY_UNSPECIFIED is invalid.
  UPDATE_AVAILABILITY_UNSPECIFIED = 0;
  // UPDATE_AVAILABILITY_LISTED: the packages below are the host's updates.
  UPDATE_AVAILABILITY_LISTED = 1;
  // UPDATE_AVAILABILITY_NO_HELPER: the root helper is not installed or not running.
  UPDATE_AVAILABILITY_NO_HELPER = 2;
  // UPDATE_AVAILABILITY_HELPER_TOO_OLD: the helper doesn't know the operation.
  UPDATE_AVAILABILITY_HELPER_TOO_OLD = 3;
  // UPDATE_AVAILABILITY_UNSUPPORTED: the host's distribution has no supported package manager.
  UPDATE_AVAILABILITY_UNSUPPORTED = 4;
  // UPDATE_AVAILABILITY_FAILED: listing failed; reason says why.
  UPDATE_AVAILABILITY_FAILED = 5;
}

// UpdateReport is what the host could update (KONZEPT §14.1), every 6 hours, after the package
// manager ran and on RefreshUpdateInfo. Names, versions and sources come from the host's package
// sources: shown as text only.
message UpdateReport {
  // collected_at is the agent's time of the listing.
  google.protobuf.Timestamp collected_at = 1 [(buf.validate.field).required = true];
  // availability says whether the packages below are the host's updates.
  UpdateAvailability availability = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // reason explains an availability other than listed, or what limits a listing (sources not
  // refreshed, an output cut, security updates or the reboot unknown).
  string reason = 3 [(buf.validate.field).string.max_bytes = 1024];
  // package_manager says how the updates were listed.
  PackageManager package_manager = 4 [(buf.validate.field).enum.defined_only = true];
  // packages are the available updates, security updates first, at most 5000.
  repeated UpdatePackage packages = 5 [(buf.validate.field).repeated.max_items = 5000];
  // total_count counts all available updates, the omitted ones too.
  uint32 total_count = 6 [(buf.validate.field).uint32.lte = 1000000];
  // security_count counts the security updates among them (0 without security metadata).
  uint32 security_count = 7 [(buf.validate.field).uint32.lte = 1000000];
  // reboot_required: the host needs a reboot to use what is installed (KONZEPT §14.1).
  bool reboot_required = 8;
  // reboot_reason says why, e.g. the packages of /var/run/reboot-required.pkgs.
  string reboot_reason = 9 [(buf.validate.field).string.max_bytes = 1024];
  // last_upgrade_at is when packages were last upgraded, if known.
  google.protobuf.Timestamp last_upgrade_at = 10;
  // permissions are what the host allows remotely (/etc/sermon/helper.toml); unset without helper.
  HelperPermissions permissions = 11;
  // refreshed: the package sources were updated just before listing.
  bool refreshed = 12;
}

// UpdatePackage is one available update.
message UpdatePackage {
  // name is the package's name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  // installed_version is the version installed now.
  string installed_version = 2 [(buf.validate.field).string.max_bytes = 256];
  // candidate_version is the version the update installs.
  string candidate_version = 3 [(buf.validate.field).string.max_bytes = 256];
  // source is where it comes from, e.g. "bookworm-security" or a repository's ID.
  string source = 4 [(buf.validate.field).string.max_bytes = 256];
  // security: the source marks it as a security update.
  bool security = 5;
}

// HelperPermissions are the switches of /etc/sermon/helper.toml (ADR 0035).
message HelperPermissions {
  // remote_updates: updates may be installed on request of the server.
  bool remote_updates = 1;
  // remote_reboot: the host may be rebooted on request of the server.
  bool remote_reboot = 2;
  // self_update: the agent may replace its binary on request of the server.
  bool self_update = 3;
}

// CommandPhase is how far a command of the server has come.
enum CommandPhase {
  // COMMAND_PHASE_UNSPECIFIED is invalid.
  COMMAND_PHASE_UNSPECIFIED = 0;
  // COMMAND_PHASE_STARTED: the root helper took it and runs it.
  COMMAND_PHASE_STARTED = 1;
  // COMMAND_PHASE_SUCCEEDED: it ended with exit code 0.
  COMMAND_PHASE_SUCCEEDED = 2;
  // COMMAND_PHASE_FAILED: it ran and failed; exit_code and output tell how.
  COMMAND_PHASE_FAILED = 3;
  // COMMAND_PHASE_REFUSED: not run, the host forbids it or the helper refused; reason says why.
  COMMAND_PHASE_REFUSED = 4;
  // COMMAND_PHASE_UNSUPPORTED: not run, no helper, a helper too old or an unsupported host.
  COMMAND_PHASE_UNSUPPORTED = 5;
  // COMMAND_PHASE_LOST: the helper knows the run no longer (its result expired).
  COMMAND_PHASE_LOST = 6;
}

// CommandResult is the state of a command of the server.
message CommandResult {
  // run_id is the run's ID from the command.
  string run_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"];
  // phase is how far it has come.
  CommandPhase phase = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // exit_code is the command's exit code once it ran; -1 if it was killed.
  sint32 exit_code = 3;
  // reason explains a refusal or failure.
  string reason = 4 [(buf.validate.field).string.max_bytes = 1024];
  // output is the end of the command's output, redacted by the agent, at most 256 KiB.
  string output = 5 [(buf.validate.field).string.max_bytes = 262144];
  // output_truncated: the beginning of the output was cut.
  bool output_truncated = 6;
  // started_at is when the helper started the run.
  google.protobuf.Timestamp started_at = 7;
  // ended_at is when it ended.
  google.protobuf.Timestamp ended_at = 8;
}
