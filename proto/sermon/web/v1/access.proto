syntax = "proto3";

package sermon.web.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "sermon/web/v1/organization.proto";

// AccessService manages node groups, members and roles of the caller's active organization
// (KONZEPT §7). All RPCs require a session; objects of other organizations are reported as
// NOT_FOUND. Changes of rights (GrantRole, RevokeRole, RemoveMember, DeleteNodeGroup) require a recent
// re-authentication (FAILED_PRECONDITION otherwise) and are written to the audit log.
service AccessService {
  // ListNodeGroups returns the node groups the caller can see (at least viewer).
  rpc ListNodeGroups(ListNodeGroupsRequest) returns (ListNodeGroupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateNodeGroup creates a node group (org admin). ALREADY_EXISTS for a duplicate name.
  rpc CreateNodeGroup(CreateNodeGroupRequest) returns (CreateNodeGroupResponse);
  // RenameNodeGroup renames a node group (org admin).
  rpc RenameNodeGroup(RenameNodeGroupRequest) returns (RenameNodeGroupResponse);
  // DeleteNodeGroup deletes a node group and its role bindings (org admin, step-up).
  rpc DeleteNodeGroup(DeleteNodeGroupRequest) returns (DeleteNodeGroupResponse);
  // ListMembers returns the members of the organization with their roles (org admin).
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GrantRole gives a member a role on one node group or on all groups; an existing role on
  // the same group is replaced (org admin, step-up).
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  // RevokeRole removes a role binding (org admin, step-up). The last org-wide admin cannot be
  // removed (FAILED_PRECONDITION).
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  // RemoveMember removes a user from the organization and ends the user's sessions in it
  // (org admin, step-up).
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // InviteMember invites an e-mail address with an initial role (org admin, step-up). In
  // production the link goes out by mail only (emailed; inviting the address again sends a new
  // one). Without mail (development) the response contains the link token once; the UI builds
  // the link "<origin>/invite#<token>". The response is the same whether or not the address
  // already has an account (ADR 0008). UNAVAILABLE: the mail could not be sent.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  // ListInvitations returns the open invitations (org admin).
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeInvitation deletes an open invitation (org admin).
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  // ListAuditLog returns audit entries, newest first (org admin).
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetOrganizationQuotas returns the quotas the superadmin set and how much of them is used
  // (org admin, M2-32).
  rpc GetOrganizationQuotas(GetOrganizationQuotasRequest) returns (GetOrganizationQuotasResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetRetention returns how long the organization keeps its logs and security events, the
  // instance's limits and the organization's cap (org admin, M5-30).
  rpc GetRetention(GetRetentionRequest) returns (GetRetentionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetRetention changes it within the limits and the cap (INVALID_ARGUMENT otherwise); org admin
  // with a recent re-authentication. Older data goes with the next run of the job: events within
  // an hour, logs within a day.
  rpc SetRetention(SetRetentionRequest) returns (SetRetentionResponse);
}

// GetRetentionRequest has no parameters.
message GetRetentionRequest {}

// GetRetentionResponse is the retention of the organization; 0 days is the instance's default.
message GetRetentionResponse {
  // log_retention_days is how long logs are kept (0: the instance's default).
  uint32 log_retention_days = 1;
  // event_retention_days is how long security events and the alert history are kept (0: default).
  uint32 event_retention_days = 2;
  // log_min_days and log_max_days bound the logs; log_max_days is the instance's default.
  uint32 log_min_days = 3;
  // log_max_days is the longest (and default) retention of logs.
  uint32 log_max_days = 4;
  // event_min_days is the shortest retention of events.
  uint32 event_min_days = 5;
  // event_max_days is the longest retention of events.
  uint32 event_max_days = 6;
  // cap_days is the superadmin's cap of the organization (0: none); settings above it are refused.
  uint32 cap_days = 7;
  // event_default_days is the instance's default for events (SERMON_EVENT_RETENTION): what 0 in
  // event_retention_days means.
  uint32 event_default_days = 8;
}

// SetRetentionRequest is the new retention; 0 days is the instance's default.
message SetRetentionRequest {
  // log_retention_days is 0 or 1 to 14.
  uint32 log_retention_days = 1 [(buf.validate.field).uint32.lte = 14];
  // event_retention_days is 0 or 7 to 365.
  uint32 event_retention_days = 2 [(buf.validate.field).uint32.lte = 365];
}

// SetRetentionResponse is empty.
message SetRetentionResponse {}

// GetOrganizationQuotasRequest has no parameters.
message GetOrganizationQuotasRequest {}

// GetOrganizationQuotasResponse is the state of the quotas.
message GetOrganizationQuotasResponse {
  // quotas are the organization's limits; unset fields are the instance defaults.
  OrganizationQuotas quotas = 1;
  // nodes is the number of enrolled nodes.
  int64 nodes = 2;
  // members is the number of members.
  int64 members = 3;
  // open_invitations is the number of open invitations (they count towards max_members).
  int64 open_invitations = 4;
}

// Role is a role on a node group or on all groups.
enum Role {
  // ROLE_UNSPECIFIED is invalid.
  ROLE_UNSPECIFIED = 0;
  // ROLE_VIEWER may view nodes, metrics and (unless disabled) logs.
  ROLE_VIEWER = 1;
  // ROLE_OPERATOR may additionally acknowledge alerts, run updates and reboots.
  ROLE_OPERATOR = 2;
  // ROLE_ADMIN may additionally manage the group; on all groups the whole organization.
  ROLE_ADMIN = 3;
}

// NodeGroup is a group of nodes; roles are granted per group.
message NodeGroup {
  // id is the group UUID.
  string id = 1;
  // name is the display name.
  string name = 2;
  // create_time is when the group was created.
  google.protobuf.Timestamp create_time = 3;
}

// ListNodeGroupsRequest has no parameters.
message ListNodeGroupsRequest {}

// ListNodeGroupsResponse lists node groups by name.
message ListNodeGroupsResponse {
  // groups are the visible node groups.
  repeated NodeGroup groups = 1;
}

// CreateNodeGroupRequest names the new group.
message CreateNodeGroupRequest {
  // name is the display name (unique within the organization).
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// CreateNodeGroupResponse returns the new group.
message CreateNodeGroupResponse {
  // group is the created group.
  NodeGroup group = 1;
}

// RenameNodeGroupRequest names the group and its new name.
message RenameNodeGroupRequest {
  // group_id is the UUID of the group.
  string group_id = 1 [(buf.validate.field).string.uuid = true];
  // name is the new display name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// RenameNodeGroupResponse has no fields.
message RenameNodeGroupResponse {}

// DeleteNodeGroupRequest names the group.
message DeleteNodeGroupRequest {
  // group_id is the UUID of the group.
  string group_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteNodeGroupResponse has no fields.
message DeleteNodeGroupResponse {}

// RoleBinding is a role of a member on one group or on all groups.
message RoleBinding {
  // id is the binding UUID (for RevokeRole).
  string id = 1;
  // group_id is the UUID of the group; empty means all groups of the organization.
  string group_id = 2;
  // role is the granted role.
  Role role = 3;
  // from_oidc marks a role the organization's OIDC group mappings gave (M3-21): the next
  // sign-in of the member may change or remove it. Granting it by hand makes it manual.
  bool from_oidc = 4;
}

// Member is a user of the organization.
message Member {
  // user_id is the user UUID.
  string user_id = 1;
  // email is the user's e-mail address.
  string email = 2;
  // display_name is the user's name.
  string display_name = 3;
  // bindings are the member's roles.
  repeated RoleBinding bindings = 4;
}

// ListMembersRequest has no parameters.
message ListMembersRequest {}

// ListMembersResponse lists the members by e-mail address.
message ListMembersResponse {
  // members of the organization.
  repeated Member members = 1;
}

// GrantRoleRequest names member, group and role.
message GrantRoleRequest {
  // user_id is the UUID of a member of the organization.
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  // group_id is the UUID of the group; empty grants the role on all groups.
  string group_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // role is the role to grant.
  Role role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// GrantRoleResponse identifies the binding.
message GrantRoleResponse {
  // binding_id is the UUID of the new or replaced binding.
  string binding_id = 1;
}

// RevokeRoleRequest names the binding.
message RevokeRoleRequest {
  // binding_id is the UUID of the binding.
  string binding_id = 1 [(buf.validate.field).string.uuid = true];
}

// RevokeRoleResponse has no fields.
message RevokeRoleResponse {}

// RemoveMemberRequest names the member.
message RemoveMemberRequest {
  // user_id is the UUID of the member.
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

// RemoveMemberResponse has no fields.
message RemoveMemberResponse {}

// AuditEntry is an entry of the organization's audit log.
message AuditEntry {
  // seq is the position in the organization's log (1, 2, …).
  int64 seq = 1;
  // time is when the change happened.
  google.protobuf.Timestamp time = 2;
  // actor_id is the UUID of the acting user; empty for system actions.
  string actor_id = 3;
  // action names the change, e.g. "role.grant".
  string action = 4;
  // target names the changed object, e.g. "user:<uuid>".
  string target = 5;
  // details are facts about the change, e.g. role and group.
  map<string, string> details = 6;
}

// ListAuditLogRequest pages through the log.
message ListAuditLogRequest {
  // before_seq returns entries older than this seq; 0 starts with the newest entry.
  int64 before_seq = 1 [(buf.validate.field).int64.gte = 0];
  // page_size is the maximum number of entries (default 100, at most 500).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
}

// ListAuditLogResponse is one page of the log.
message ListAuditLogResponse {
  // entries, newest first.
  repeated AuditEntry entries = 1;
}

// InviteMemberRequest names the address and the initial role.
message InviteMemberRequest {
  // email is the address to invite.
  string email = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 320
  }];
  // group_id is the UUID of the group; empty grants the role on all groups.
  string group_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // role is the initial role.
  Role role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// InviteMemberResponse returns the invitation and, without mail, its link token (shown once).
message InviteMemberResponse {
  // invitation is the stored invitation.
  Invitation invitation = 1;
  // token is the secret part of the link; it cannot be retrieved again. Empty if emailed.
  string token = 2;
  // emailed is set when the link went to the invited address by mail (nobody else sees it).
  bool emailed = 3;
}

// Invitation is an open invitation.
message Invitation {
  // id is the invitation UUID.
  string id = 1;
  // email is the invited address.
  string email = 2;
  // group_id is the UUID of the group; empty means all groups.
  string group_id = 3;
  // role is the initial role.
  Role role = 4;
  // invited_by is the UUID of the inviting user; empty if the user was deleted.
  string invited_by = 5;
  // create_time is when the invitation was created.
  google.protobuf.Timestamp create_time = 6;
  // expire_time is when the link stops working.
  google.protobuf.Timestamp expire_time = 7;
}

// ListInvitationsRequest has no parameters.
message ListInvitationsRequest {}

// ListInvitationsResponse lists open invitations, newest first.
message ListInvitationsResponse {
  // invitations of the organization.
  repeated Invitation invitations = 1;
}

// RevokeInvitationRequest names the invitation.
message RevokeInvitationRequest {
  // invitation_id is the UUID of the invitation.
  string invitation_id = 1 [(buf.validate.field).string.uuid = true];
}

// RevokeInvitationResponse has no fields.
message RevokeInvitationResponse {}
