syntax = "proto3";

package sermon.web.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// AuthService handles local login sessions (KONZEPT §7). The session token travels only in the
// HttpOnly cookie "__Host-sermon_session", never in message bodies.
service AuthService {
  // Login checks e-mail and password and sets the session cookie. All failures return
  // UNAUTHENTICATED with the same message (no user enumeration); too many attempts from one
  // client return RESOURCE_EXHAUSTED. Users with two-factor authentication get a session that
  // waits for VerifySecondFactor (second_factor_required, valid for 5 minutes).
  rpc Login(LoginRequest) returns (LoginResponse);
  // VerifySecondFactor completes a login with a TOTP or recovery code and replaces the cookie
  // with the full session. UNAUTHENTICATED without a waiting session, PERMISSION_DENIED for a
  // wrong or used code or a locked account (counts towards the lockout).
  rpc VerifySecondFactor(VerifySecondFactorRequest) returns (VerifySecondFactorResponse);
  // Logout ends the current session and clears the cookie.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // GetSession describes the current session; UNAUTHENTICATED without a valid session.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SwitchOrganization moves the session to another organization of the user under a new
  // session cookie. NOT_FOUND if the user is not a member. Timeouts and the time of the last
  // re-authentication are kept.
  rpc SwitchOrganization(SwitchOrganizationRequest) returns (SwitchOrganizationResponse);
  // ConfirmPassword re-authenticates the user of the current session with the password and renews
  // the step-up for sensitive actions (rights, invitations, key rotation; KONZEPT §7).
  // UNAUTHENTICATED without a valid session, PERMISSION_DENIED for a wrong password or a
  // temporarily locked account (failures count towards the login lockout), RESOURCE_EXHAUSTED
  // for too many attempts from one client.
  // Users with two-factor authentication use ConfirmSecondFactor (FAILED_PRECONDITION here).
  rpc ConfirmPassword(ConfirmPasswordRequest) returns (ConfirmPasswordResponse);
  // ConfirmSecondFactor renews the step-up with a TOTP or recovery code; errors as ConfirmPassword.
  rpc ConfirmSecondFactor(ConfirmSecondFactorRequest) returns (ConfirmSecondFactorResponse);
}

// LoginRequest carries the credentials.
message LoginRequest {
  // email is the user's e-mail address (case-insensitive).
  string email = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 320
  }];
  // password is the user's password.
  string password = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 1024
  }];
}

// LoginResponse describes the new session.
message LoginResponse {
  // session is the started session; absent while the second factor is missing.
  Session session = 1;
  // second_factor_required means: call VerifySecondFactor with a code from the app.
  bool second_factor_required = 2;
}

// VerifySecondFactorRequest carries the code.
message VerifySecondFactorRequest {
  // code is a 6-digit TOTP code or a recovery code.
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// VerifySecondFactorResponse describes the full session.
message VerifySecondFactorResponse {
  // session is the started session.
  Session session = 1;
}

// ConfirmSecondFactorRequest carries the code.
message ConfirmSecondFactorRequest {
  // code is a 6-digit TOTP code or a recovery code.
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// ConfirmSecondFactorResponse describes the session with the renewed step-up.
message ConfirmSecondFactorResponse {
  // session is the current session.
  Session session = 1;
}

// LogoutRequest has no parameters.
message LogoutRequest {}

// LogoutResponse has no fields.
message LogoutResponse {}

// GetSessionRequest has no parameters.
message GetSessionRequest {}

// GetSessionResponse describes the current session.
message GetSessionResponse {
  // session is the current session.
  Session session = 1;
}

// SwitchOrganizationRequest names the target organization.
message SwitchOrganizationRequest {
  // organization_id is the UUID of an organization the user is a member of.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
}

// SwitchOrganizationResponse describes the moved session.
message SwitchOrganizationResponse {
  // session is the session in the new organization.
  Session session = 1;
}

// ConfirmPasswordRequest carries the password of the logged-in user.
message ConfirmPasswordRequest {
  // password is the user's password.
  string password = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 1024
  }];
}

// ConfirmPasswordResponse describes the session with the renewed step-up.
message ConfirmPasswordResponse {
  // session is the current session.
  Session session = 1;
}

// StepUpRequired is attached as error detail to FAILED_PRECONDITION when a sensitive action needs
// a fresh re-authentication: call ConfirmPassword, then retry the action.
message StepUpRequired {}

// SecondFactorSetupRequired is attached as error detail to FAILED_PRECONDITION when the active
// organization requires two-factor authentication and the user has none: set it up with
// TwoFactorService first.
message SecondFactorSetupRequired {}

// Session is the view of a login session for the UI.
message Session {
  // user_id is the UUID of the logged-in user.
  string user_id = 1;
  // email is the user's e-mail address.
  string email = 2;
  // display_name is the user's name.
  string display_name = 3;
  // active_organization_id is the organization the session acts in (empty without membership).
  string active_organization_id = 4;
  // organizations are all organizations the user is a member of.
  repeated Organization organizations = 5;
  // step_up_until is when the last (re-)authentication stops allowing sensitive actions; after
  // that they fail with FAILED_PRECONDITION until ConfirmPassword is called.
  google.protobuf.Timestamp step_up_until = 6;
  // second_factor_enabled means the step-up needs ConfirmSecondFactor instead of the password.
  bool second_factor_enabled = 7;
  // second_factor_setup_required means the active organization requires two-factor
  // authentication the user doesn't have yet; only TwoFactorService works until it is set up.
  bool second_factor_setup_required = 8;
  // org_admin is true for admins of all groups of the active organization (members, groups,
  // invitations, security policy, audit log). The server checks every call anyway.
  bool org_admin = 9;
  // enroll_group_ids are the groups where the caller may add nodes (operator or admin); the
  // single value "*" stands for all groups.
  repeated string enroll_group_ids = 10;
  // silence_group_ids are the groups where the caller may create silences (operator or admin);
  // the single value "*" stands for all groups.
  repeated string silence_group_ids = 11;
  // node_identity_group_ids are the groups where the caller may rotate, revoke, unlock and allow
  // the takeover of nodes (operator or admin, M2-23); the single value "*" stands for all groups.
  repeated string node_identity_group_ids = 12;
  // superadmin is set for superadmins of the instance (M2-24).
  bool superadmin = 13;
  // instance_problems are the self-monitoring problems of the server, only for superadmins
  // (M2-24); empty while all is well.
  repeated InstanceProblem instance_problems = 14;
  // tag_group_ids are the groups where the caller may set the tags of nodes (admin, M2-29); the
  // single value "*" stands for all groups.
  repeated string tag_group_ids = 15;
}

// InstanceProblem is a check of the server's self-monitoring that is not OK.
message InstanceProblem {
  // check is ingest_lag, dropped_samples, dropped_security_events, database_size or
  // logs_unavailable.
  string check = 1;
  // level is warning or critical.
  string level = 2;
  // since is when it reached this level.
  google.protobuf.Timestamp since = 3;
  // value is the lag in seconds, the samples dropped within 15 minutes or the share of the
  // database limit (0..1).
  double value = 4;
}

// Organization is an organization the user belongs to.
message Organization {
  // id is the organization UUID.
  string id = 1;
  // name is the display name.
  string name = 2;
}
