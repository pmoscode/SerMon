syntax = "proto3";

package sermon.web.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "sermon/web/v1/log_settings.proto";

// LogService reads the logs of the nodes the caller may see them of (KONZEPT §10.4, M3-08): the
// groups with view_logs – viewers only while the organization allows them logs. Users never write
// LogQL; nodes of other groups or organizations yield nothing. UNAVAILABLE while the log store
// (Loki) is not reachable or not configured.
service LogService {
  // QueryLogs returns the lines of the filter, newest first unless oldest_first.
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetLogHistogram counts the lines of the filter per severity in about 100 steps.
  rpc GetLogHistogram(GetLogHistogramRequest) returns (GetLogHistogramResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetLogContext returns up to 50 lines before an entry, the entry and up to 50 after, of the same
  // node, source and unit; NOT_FOUND for a node the caller doesn't see.
  rpc GetLogContext(GetLogContextRequest) returns (GetLogContextResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// LogSource is where the agent read a line.
enum LogSource {
  // LOG_SOURCE_UNSPECIFIED: unknown; not allowed as a filter.
  LOG_SOURCE_UNSPECIFIED = 0;
  // LOG_SOURCE_JOURNAL is the systemd journal.
  LOG_SOURCE_JOURNAL = 1;
  // LOG_SOURCE_FILE is a log file.
  LOG_SOURCE_FILE = 2;
}

// LogFilter selects log lines.
message LogFilter {
  option (buf.validate.message).cel = {
    id: "range"
    message: "from must be before to and the range at most 14 days"
    expression: "this.from < this.to && this.to - this.from <= duration('336h')"
  };

  // from is the start of the time range (inclusive).
  google.protobuf.Timestamp from = 1 [(buf.validate.field).required = true];
  // to is the end of the time range (exclusive).
  google.protobuf.Timestamp to = 2 [(buf.validate.field).required = true];
  // node_ids narrow to these nodes; empty: every visible node.
  repeated string node_ids = 3 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
  // group_id narrows to the nodes of this group.
  optional string group_id = 4 [(buf.validate.field).string.uuid = true];
  // sources narrow to these sources; empty: all.
  repeated LogSource sources = 5 [(buf.validate.field).repeated = {
    max_items: 2
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // units narrow to these systemd units or syslog identifiers; empty: all.
  repeated string units = 6 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {
        min_len: 1
        max_bytes: 256
      }
    }
  }];
  // min_severity keeps this severity and the more severe ones; unspecified keeps all.
  LogSeverity min_severity = 7 [(buf.validate.field).enum.defined_only = true];
  // text is a part of the line, as typed (no regex).
  string text = 8 [(buf.validate.field).string.max_bytes = 256];
  // ignore_case matches text regardless of case.
  bool ignore_case = 9;
}

// LogLine is one log line. Every text comes from the host: show it as text only.
message LogLine {
  // node_id is the node.
  string node_id = 1;
  // hostname is the node's name.
  string hostname = 2;
  // at is the time of the entry on the host.
  google.protobuf.Timestamp at = 3;
  // severity is unspecified where the source has none.
  LogSeverity severity = 4;
  // source is where the agent read the line.
  LogSource source = 5;
  // unit is the systemd unit or the syslog identifier; empty if unknown.
  string unit = 6;
  // message is the line, redacted by the agent.
  string message = 7;
  // truncated is set if the agent cut the line.
  bool truncated = 8;
  // fields are further fields: identifier, pid, process, uid, boot_id, transport, facility, file.
  map<string, string> fields = 9;
}

// QueryLogsRequest is a query.
message QueryLogsRequest {
  // filter selects the lines.
  LogFilter filter = 1 [(buf.validate.field).required = true];
  // limit is the number of lines at most; 0 is 200.
  uint32 limit = 2 [(buf.validate.field).uint32.lte = 1000];
  // oldest_first returns the oldest lines first (for following up from a point in time).
  bool oldest_first = 3;
}

// QueryLogsResponse holds the lines.
message QueryLogsResponse {
  // lines are in the requested order.
  repeated LogLine lines = 1;
  // more is set if the range holds more lines: continue with the time of the last line.
  bool more = 2;
}

// GetLogHistogramRequest is a histogram query.
message GetLogHistogramRequest {
  // filter selects the lines.
  LogFilter filter = 1 [(buf.validate.field).required = true];
}

// GetLogHistogramResponse holds the counts.
message GetLogHistogramResponse {
  // step is the width of a bucket.
  google.protobuf.Duration step = 1;
  // series are the counts per severity.
  repeated LogHistogramSeries series = 2;
}

// LogHistogramSeries are the counts of one severity.
message LogHistogramSeries {
  // severity is unspecified for lines without one.
  LogSeverity severity = 1;
  // points are the buckets with lines, by time.
  repeated LogHistogramPoint points = 2;
}

// LogHistogramPoint is one bucket.
message LogHistogramPoint {
  // at is the end of the bucket.
  google.protobuf.Timestamp at = 1;
  // count is the number of lines.
  double count = 2;
}

// GetLogContextRequest names an entry.
message GetLogContextRequest {
  // node_id is the entry's node.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
  // at is the entry's time.
  google.protobuf.Timestamp at = 2 [(buf.validate.field).required = true];
  // source is the entry's source.
  LogSource source = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // unit is the entry's unit; empty for entries without one.
  string unit = 4 [(buf.validate.field).string.max_bytes = 256];
}

// GetLogContextResponse holds the lines around the entry, oldest first.
message GetLogContextResponse {
  // lines are the lines before, the entry and the lines after.
  repeated LogLine lines = 1;
}
