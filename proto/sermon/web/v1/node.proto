syntax = "proto3";

package sermon.web.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "sermon/web/v1/fleet.proto";

// NodeService shows and manages nodes (KONZEPT §6, §7, §8.2).
service NodeService {
  // GetNode returns the details of a node the caller may view; unknown or foreign nodes are
  // NOT_FOUND.
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  // ListFilesystems returns the file systems of a node with fill level and a forecast when they
  // run full (linear trend of the last 24 hours).
  rpc ListFilesystems(ListFilesystemsRequest) returns (ListFilesystemsResponse);

  // RotateNodeKeys rotates the keys of nodes now (e.g. after a leaked backup). Online agents get
  // a new certificate over their stream and the old one is revoked at once; offline nodes have
  // all certificates revoked and must be re-enrolled. With revoke_only every node has all
  // certificates revoked and its session ended – for a key that may have been stolen, because
  // the agent connected right now could be the thief. Needs operator or admin on the affected
  // groups and a recent re-authentication. Unknown or foreign nodes and groups are NOT_FOUND.
  rpc RotateNodeKeys(RotateNodeKeysRequest) returns (RotateNodeKeysResponse);

  // UnlockNode lifts the lock of a node (M2-23): its certificate is accepted again. If its key may
  // have been stolen, use RotateNodeKeys with revoke_only instead. Needs operator on the node's
  // group and a recent re-authentication; unknown or foreign nodes are NOT_FOUND.
  rpc UnlockNode(UnlockNodeRequest) returns (UnlockNodeResponse);
  // AllowNodeTakeover lets the next enrollment with the node's machine-id and a token of its group
  // take the node over for an hour (reinstalled host): it keeps ID and history, its old
  // certificates are revoked. Rights as UnlockNode.
  rpc AllowNodeTakeover(AllowNodeTakeoverRequest) returns (AllowNodeTakeoverResponse);
  // SetNodeTags replaces the tags of a node (M2-29): free key=value pairs for filters and for
  // matching in rules, notification policies and silences, never for rights. Needs admin on the
  // node's group and a recent re-authentication; unknown or foreign nodes are NOT_FOUND.
  rpc SetNodeTags(SetNodeTagsRequest) returns (SetNodeTagsResponse);
}

// SetNodeTagsRequest names the node and its new tags.
message SetNodeTagsRequest {
  // node_id is the node UUID.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
  // tags replace all tags of the node (empty: none). Keys are lowercase letters, digits, _ and -
  // beginning with a letter; values letters, digits and _ . : / - beginning with a letter or digit.
  map<string, string> tags = 2 [(buf.validate.field).map = {
    max_pairs: 16
    keys: {
      string: {pattern: "^[a-z][a-z0-9_-]{0,31}$"}
    }
    values: {
      string: {pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,62}$"}
    }
  }];
}

// SetNodeTagsResponse is empty.
message SetNodeTagsResponse {}

// UnlockNodeRequest names the node.
message UnlockNodeRequest {
  // node_id is the node UUID.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
}

// UnlockNodeResponse is empty.
message UnlockNodeResponse {}

// AllowNodeTakeoverRequest names the node.
message AllowNodeTakeoverRequest {
  // node_id is the node UUID.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
}

// AllowNodeTakeoverResponse says how long the takeover is allowed.
message AllowNodeTakeoverResponse {
  // until is the end of the takeover window.
  google.protobuf.Timestamp until = 1;
}

// RotateNodeKeysRequest selects the nodes.
message RotateNodeKeysRequest {
  // target selects the nodes; exactly one must be set.
  oneof target {
    option (buf.validate.oneof).required = true;

    // nodes are node UUIDs (at most 1000).
    NodeIDs nodes = 1;
    // group_id selects all nodes of a group.
    string group_id = 2 [(buf.validate.field).string.uuid = true];
    // organization selects all nodes of the caller's organization (needs operator on all groups).
    bool organization = 3 [(buf.validate.field).bool.const = true];
  }
  // revoke_only revokes all certificates of the nodes and ends their sessions instead of asking
  // connected agents to rotate; every node must be enrolled again.
  bool revoke_only = 4;
}

// NodeIDs is a list of node UUIDs.
message NodeIDs {
  // ids are node UUIDs.
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
}

// RotateNodeKeysResponse reports what happened.
message RotateNodeKeysResponse {
  // online is the number of connected nodes that were asked to rotate now.
  int32 online = 1;
  // offline is the number of nodes whose certificates were revoked (re-enrollment needed).
  int32 offline = 2;
  // revoked is the number of nodes whose certificates were revoked with revoke_only
  // (re-enrollment needed).
  int32 revoked = 3;
}

// GetNodeRequest names the node.
message GetNodeRequest {
  // node_id is the node UUID.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetNodeResponse holds the node.
message GetNodeResponse {
  // node is the node.
  Node node = 1;
}

// Node are the details of a node.
message Node {
  // id is the node UUID.
  string id = 1;
  // hostname is the host name from the agent.
  string hostname = 2;
  // group_id is the node group.
  string group_id = 3;
  // group_name is the name of the node group.
  string group_name = 4;
  // os_id is the operating system, e.g. "debian".
  string os_id = 5;
  // os_version is its version, e.g. "13".
  string os_version = 6;
  // kernel_release is the kernel version.
  string kernel_release = 7;
  // architecture is amd64 or arm64.
  string architecture = 8;
  // cpu_count is the number of logical CPUs.
  uint32 cpu_count = 9;
  // memory_bytes is the physical memory.
  uint64 memory_bytes = 10;
  // agent_version is the version of the agent at the last connection.
  string agent_version = 11;
  // enrolled_at is when the node was enrolled.
  google.protobuf.Timestamp enrolled_at = 12;
  // last_seen_at is the last contact, if any.
  google.protobuf.Timestamp last_seen_at = 13;
  // online is true with contact in the last 60 seconds.
  bool online = 14;
  // figures are the current values (absent without live data).
  KeyFigures figures = 15;
  // locked_at is set while the node is locked (a second session, or a rotation from a new
  // address): its certificate is refused until an operator unlocks it or it is re-enrolled.
  google.protobuf.Timestamp locked_at = 16;
  // lock_reason says why it is locked.
  string lock_reason = 17;
  // last_ip is the source address of the last agent session.
  string last_ip = 18;
  // takeover_until is set while an operator allows the next enrollment with this node's
  // machine-id to take it over.
  google.protobuf.Timestamp takeover_until = 19;
  // tags are the node's free key=value pairs, e.g. env: prod (M2-29).
  map<string, string> tags = 20;
}

// ListFilesystemsRequest names the node.
message ListFilesystemsRequest {
  // node_id is the node UUID.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
}

// ListFilesystemsResponse holds the file systems.
message ListFilesystemsResponse {
  // filesystems are sorted by mount point.
  repeated Filesystem filesystems = 1;
}

// Filesystem is one mounted file system with current values from the last minute.
message Filesystem {
  // mountpoint is where it is mounted.
  string mountpoint = 1;
  // size_bytes is the size.
  uint64 size_bytes = 2;
  // used_bytes is the used space.
  uint64 used_bytes = 3;
  // avail_bytes is the space available to unprivileged users.
  uint64 avail_bytes = 4;
  // used_ratio is used / (used + avail), 0..1, like df.
  double used_ratio = 5;
  // readonly is true when mounted read-only.
  bool readonly = 6;
  // inodes_total is the number of inodes.
  uint64 inodes_total = 7;
  // inodes_used is the number of used inodes.
  uint64 inodes_used = 8;
  // full_at is when the file system runs full at the current trend (only within a year).
  google.protobuf.Timestamp full_at = 9;
}
