syntax = "proto3";

package sermon.web.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// OrganizationService lets the superadmin manage organizations (KONZEPT §7). It requires a
// session of a superadmin (PERMISSION_DENIED otherwise). The superadmin sees names and member
// counts only; tenant data needs a membership.
service OrganizationService {
  // ListOrganizations returns all organizations.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateOrganization creates an organization and invites its first admin (step-up). In
  // production the link goes to the admin by mail only (invitation_emailed); without mail
  // (development) the response contains the link token once (ADR 0008). UNAVAILABLE: the
  // organization exists but the mail could not be sent – invite the admin again.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  // RenameOrganization renames an organization. ALREADY_EXISTS: another organization has this
  // name (names are unique regardless of case).
  rpc RenameOrganization(RenameOrganizationRequest) returns (RenameOrganizationResponse);
  // UpdateOrganization sets the name and the quotas of an organization (step-up, M2-32). A
  // lowered quota deletes nothing: what exists keeps running, only new things are refused.
  // ALREADY_EXISTS: another organization has this name.
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse);
  // LockOrganization locks an organization without a deadline (M2-33, step-up, the name typed):
  // no logins, agent connections, enrollments or invitations; certificates stay valid, alerts
  // and notifications rest. FAILED_PRECONDITION: the typed name does not match.
  rpc LockOrganization(LockOrganizationRequest) returns (LockOrganizationResponse);
  // ScheduleOrganizationDeletion locks an organization and deletes it after the grace of the
  // server (30 days by default, at least 7).
  rpc ScheduleOrganizationDeletion(ScheduleOrganizationDeletionRequest) returns (ScheduleOrganizationDeletionResponse);
  // UnlockOrganization lifts the lock and a scheduled deletion. FAILED_PRECONDITION: not locked
  // or the typed name does not match.
  rpc UnlockOrganization(UnlockOrganizationRequest) returns (UnlockOrganizationResponse);
  // DeleteOrganization deletes a locked organization at once, with its data and the accounts
  // without another membership. FAILED_PRECONDITION: not locked or the typed name does not match.
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);
  // ExportOrganizationAudit returns the audit log of a locked organization as a file with the
  // hash chain (step-up); the export is recorded in the instance's audit log.
  rpc ExportOrganizationAudit(ExportOrganizationAuditRequest) returns (ExportOrganizationAuditResponse);
}

// OrganizationStatus is the state of an organization (M2-33 adds locked and scheduled for
// deletion).
enum OrganizationStatus {
  // ORGANIZATION_STATUS_UNSPECIFIED is not used.
  ORGANIZATION_STATUS_UNSPECIFIED = 0;
  // ORGANIZATION_STATUS_ACTIVE: members log in, agents send.
  ORGANIZATION_STATUS_ACTIVE = 1;
  // ORGANIZATION_STATUS_LOCKED: locked until a superadmin lifts it.
  ORGANIZATION_STATUS_LOCKED = 2;
  // ORGANIZATION_STATUS_DELETION_SCHEDULED: locked and deleted at deletion_due_at.
  ORGANIZATION_STATUS_DELETION_SCHEDULED = 3;
}

// OrganizationQuotas bound an organization instead of the instance-wide values (ADR 0029).
// An unset field means the instance default (no limit for nodes and members).
message OrganizationQuotas {
  // max_nodes bounds the enrolled nodes: enrolling more is refused.
  optional uint32 max_nodes = 1 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000000
  }];
  // max_members bounds members plus open invitations: inviting more is refused.
  optional uint32 max_members = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 100000
  }];
  // retention_cap_days caps the retention the organization may set for itself (applies once
  // organizations set their own retention).
  optional uint32 retention_cap_days = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 3650
  }];
  // samples_per_second is the sample rate per node before the agent is throttled.
  optional uint32 samples_per_second = 4 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000000
  }];
  // series_per_node bounds the distinct series of a node: new ones beyond it are dropped.
  optional uint32 series_per_node = 5 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 100000
  }];
}

// OrganizationSummary is an organization as the superadmin sees it.
message OrganizationSummary {
  // id is the organization UUID.
  string id = 1;
  // name is the display name.
  string name = 2;
  // create_time is when the organization was created.
  google.protobuf.Timestamp create_time = 3;
  // member_count is the number of members.
  int64 member_count = 4;
  // node_count is the number of enrolled nodes.
  int64 node_count = 5;
  // storage_bytes is the approximate storage of its metrics and security events: the totals of
  // the instance shared by its share of the series and of the events.
  int64 storage_bytes = 6;
  // status is active, locked or scheduled for deletion.
  OrganizationStatus status = 7;
  // quotas are the organization's limits.
  OrganizationQuotas quotas = 8;
  // lock_time is when it was locked (unset while active).
  google.protobuf.Timestamp lock_time = 9;
  // deletion_time is when it will be deleted (unset unless scheduled).
  google.protobuf.Timestamp deletion_time = 10;
}

// ListOrganizationsRequest has no parameters.
message ListOrganizationsRequest {}

// ListOrganizationsResponse lists organizations by name.
message ListOrganizationsResponse {
  // organizations of the instance.
  repeated OrganizationSummary organizations = 1;
}

// CreateOrganizationRequest names the organization and its first admin.
message CreateOrganizationRequest {
  // name is the display name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // admin_email is the address of the first admin, who is invited by link.
  string admin_email = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 320
  }];
}

// CreateOrganizationResponse returns the organization and the invitation link token.
message CreateOrganizationResponse {
  // organization is the created organization.
  OrganizationSummary organization = 1;
  // invitation_token is the secret part of the first admin's invitation link (shown once).
  // Empty if invitation_emailed.
  string invitation_token = 2;
  // invitation_emailed is set when the link went to the first admin by mail.
  bool invitation_emailed = 3;
}

// RenameOrganizationRequest names the organization and its new name.
message RenameOrganizationRequest {
  // organization_id is the UUID of the organization.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
  // name is the new display name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// RenameOrganizationResponse has no fields.
message RenameOrganizationResponse {}

// UpdateOrganizationRequest names the organization, its name and its quotas.
message UpdateOrganizationRequest {
  // organization_id is the UUID of the organization.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
  // name is the display name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // quotas replace the previous ones; unset fields are the instance defaults.
  OrganizationQuotas quotas = 3 [(buf.validate.field).required = true];
}

// UpdateOrganizationResponse returns the organization.
message UpdateOrganizationResponse {
  // organization is the updated organization.
  OrganizationSummary organization = 1;
}

// LockOrganizationRequest names the organization and its name, typed as confirmation.
message LockOrganizationRequest {
  // organization_id is the UUID of the organization.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
  // confirm_name is the name of the organization as typed by the superadmin.
  string confirm_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// ScheduleOrganizationDeletionRequest names the organization and its name, typed as confirmation.
message ScheduleOrganizationDeletionRequest {
  // organization_id is the UUID of the organization.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
  // confirm_name is the name of the organization as typed by the superadmin.
  string confirm_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// UnlockOrganizationRequest names the organization and its name, typed as confirmation.
message UnlockOrganizationRequest {
  // organization_id is the UUID of the organization.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
  // confirm_name is the name of the organization as typed by the superadmin.
  string confirm_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// DeleteOrganizationRequest names the organization and its name, typed as confirmation.
message DeleteOrganizationRequest {
  // organization_id is the UUID of the organization.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
  // confirm_name is the name of the organization as typed by the superadmin.
  string confirm_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// LockOrganizationResponse has no fields.
message LockOrganizationResponse {}

// ScheduleOrganizationDeletionResponse says when the organization will be deleted.
message ScheduleOrganizationDeletionResponse {
  // deletion_time is the end of the grace.
  google.protobuf.Timestamp deletion_time = 1;
}

// UnlockOrganizationResponse has no fields.
message UnlockOrganizationResponse {}

// DeleteOrganizationResponse says how many accounts went with the organization.
message DeleteOrganizationResponse {
  // accounts_deleted are the accounts that had no other membership.
  int64 accounts_deleted = 1;
}

// ExportOrganizationAuditRequest names the organization.
message ExportOrganizationAuditRequest {
  // organization_id is the UUID of the organization.
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
}

// ExportOrganizationAuditResponse is the audit log as a file: a header line, then one JSON line
// per entry with prev_hash and hash in hex.
message ExportOrganizationAuditResponse {
  // file_name is a suggestion for saving it.
  string file_name = 1;
  // content are the JSON lines.
  bytes content = 2;
  // chain_valid is false if the hash chain is broken (the file still contains every entry).
  bool chain_valid = 3;
}
