syntax = "proto3";

package sermon.web.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "sermon/web/v1/update_policy.proto";
import "sermon/web/v1/update_status.proto";

// UpdateService shows what the nodes could update (KONZEPT §14.1, M4-09): the latest report of
// each node's agent. Names, versions, sources and reasons come from the host's package sources (a
// third party): bounded, invisible characters replaced, to be shown as text only.
service UpdateService {
  // GetNodeUpdates returns a node's report with its packages (view_nodes). A node the caller
  // can't view is NOT_FOUND.
  rpc GetNodeUpdates(GetNodeUpdatesRequest) returns (GetNodeUpdatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListFleetUpdates returns the nodes the caller may view with their update status, without
  // packages, by host name, and how many nodes have each status.
  rpc ListFleetUpdates(ListFleetUpdatesRequest) returns (ListFleetUpdatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RefreshUpdateInfo asks the node's agent to list its updates with fresh sources (run_updates
  // on its group; M4-11). At most once per node within 5 minutes and 60 times a minute per
  // organization, else RESOURCE_EXHAUSTED; a node the caller can't view is NOT_FOUND. The new
  // report follows within minutes, once the agent is connected.
  rpc RefreshUpdateInfo(RefreshUpdateInfoRequest) returns (RefreshUpdateInfoResponse);
  // StartUpdates updates the nodes by hand (M4-14): run_updates on their groups (reboot_nodes
  // with reboot) and a fresh step-up. A rollout per group runs them with the group's
  // maxParallel within the next two hours; the host's helper.toml may still refuse. In the audit
  // log. A node the caller can't view is NOT_FOUND.
  rpc StartUpdates(StartUpdatesRequest) returns (StartUpdatesResponse);
  // RebootNodes reboots the nodes at once with a reason shown on the host (reboot_nodes, a fresh
  // step-up, in the audit log). Without allow_remote_reboot the host refuses.
  rpc RebootNodes(RebootNodesRequest) returns (RebootNodesResponse);
  // ListUpdateRuns returns a node's runs (updates, reboots, self-updates), newest first, without
  // output (view_nodes; M4-15).
  rpc ListUpdateRuns(ListUpdateRunsRequest) returns (ListUpdateRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetUpdateRun returns a run with its output, redacted by the agent and shown as text only
  // (view_logs on the node's group: the output is like a log of the host).
  rpc GetUpdateRun(GetUpdateRunRequest) returns (GetUpdateRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListRollouts returns the latest rollouts of the groups the caller can view, newest first.
  rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateAgents updates the agents of the nodes to the newest release of their group's channel
  // (M4-19, ADR 0036): run_updates on their groups and a fresh step-up, in the audit log. Nodes
  // installed by a package, without a newer release or whose host forbids it are skipped with
  // the reason. A node the caller can't view is NOT_FOUND.
  rpc UpdateAgents(UpdateAgentsRequest) returns (UpdateAgentsResponse);
  // CancelRollout stops a running rollout (M4-31): no node starts any more, its waiting runs are
  // cancelled, running ones go to their end without a reboot. run_updates on its group and a
  // fresh step-up, in the audit log; a rollout that ended already is FAILED_PRECONDITION.
  rpc CancelRollout(CancelRolloutRequest) returns (CancelRolloutResponse);
  // CancelRun cancels a run the node hasn't started (M4-31): a pending one never goes out, a sent
  // one is withdrawn from the agent if it still waits for the helper. run_updates (reboot_nodes
  // for a reboot) on the node's group and a fresh step-up, in the audit log; a run that started
  // or ended is FAILED_PRECONDITION.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // ListAgentReleases returns the agent releases the server offers per channel (view_nodes).
  rpc ListAgentReleases(ListAgentReleasesRequest) returns (ListAgentReleasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// InstallMethod is how a node's agent was installed.
enum InstallMethod {
  // INSTALL_METHOD_UNSPECIFIED: unknown (agents before M4-18).
  INSTALL_METHOD_UNSPECIFIED = 0;
  // INSTALL_METHOD_SCRIPT: install.sh; the agent updates itself.
  INSTALL_METHOD_SCRIPT = 1;
  // INSTALL_METHOD_PACKAGE: a package; the package manager updates it.
  INSTALL_METHOD_PACKAGE = 2;
}

// AgentInfo is a node's agent and the release of its group's channel.
message AgentInfo {
  // version is the agent's version.
  string version = 1;
  // install_method is how it was installed.
  InstallMethod install_method = 2;
  // channel is the group's release channel.
  AgentChannel channel = 3;
  // latest is the channel's newest release for the node's architecture (empty: none).
  string latest = 4;
  // target is what an agent update installs (empty: nothing, e.g. not newer or a package).
  string target = 5;
}

// UpdateAgentsRequest names the nodes.
message UpdateAgentsRequest {
  // node_ids are the nodes, 1 to 100.
  repeated string node_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
}

// SkippedNode is a node left out, with the reason.
message SkippedNode {
  // node_id is the node.
  string node_id = 1;
  // reason says why.
  string reason = 2;
}

// UpdateAgentsResponse names the runs and the skipped nodes.
message UpdateAgentsResponse {
  // run_ids are the self-update runs.
  repeated string run_ids = 1;
  // skipped are the nodes left out.
  repeated SkippedNode skipped = 2;
}

// ListAgentReleasesRequest has no fields.
message ListAgentReleasesRequest {}

// AgentRelease is a release of a channel.
message AgentRelease {
  // channel is stable or beta.
  AgentChannel channel = 1;
  // architecture is amd64 or arm64.
  string architecture = 2;
  // version is the release's version.
  string version = 3;
}

// ListAgentReleasesResponse lists the releases.
message ListAgentReleasesResponse {
  // releases per channel and architecture.
  repeated AgentRelease releases = 1;
}

// UpdateRunKind is what a run did.
enum UpdateRunKind {
  // UPDATE_RUN_KIND_UNSPECIFIED is not used.
  UPDATE_RUN_KIND_UNSPECIFIED = 0;
  // UPDATE_RUN_KIND_UPDATE installed updates.
  UPDATE_RUN_KIND_UPDATE = 1;
  // UPDATE_RUN_KIND_REBOOT rebooted.
  UPDATE_RUN_KIND_REBOOT = 2;
  // UPDATE_RUN_KIND_SELF_UPDATE replaced the agent.
  UPDATE_RUN_KIND_SELF_UPDATE = 3;
}

// UpdateRunState is where a run is.
enum UpdateRunState {
  // UPDATE_RUN_STATE_UNSPECIFIED is not used.
  UPDATE_RUN_STATE_UNSPECIFIED = 0;
  // UPDATE_RUN_STATE_PENDING waits for the node.
  UPDATE_RUN_STATE_PENDING = 1;
  // UPDATE_RUN_STATE_SENT went to the node, no answer yet.
  UPDATE_RUN_STATE_SENT = 2;
  // UPDATE_RUN_STATE_RUNNING runs on the node.
  UPDATE_RUN_STATE_RUNNING = 3;
  // UPDATE_RUN_STATE_SUCCEEDED ended with exit code 0.
  UPDATE_RUN_STATE_SUCCEEDED = 4;
  // UPDATE_RUN_STATE_FAILED ran and failed.
  UPDATE_RUN_STATE_FAILED = 5;
  // UPDATE_RUN_STATE_REFUSED: the host refused it (helper.toml) or the helper did.
  UPDATE_RUN_STATE_REFUSED = 6;
  // UPDATE_RUN_STATE_UNSUPPORTED: no helper, one too old or an unsupported host.
  UPDATE_RUN_STATE_UNSUPPORTED = 7;
  // UPDATE_RUN_STATE_LOST: the helper knows the run no longer.
  UPDATE_RUN_STATE_LOST = 8;
  // UPDATE_RUN_STATE_EXPIRED: the node didn't take it in time.
  UPDATE_RUN_STATE_EXPIRED = 9;
  // UPDATE_RUN_STATE_CANCELLED: cancelled before the node started it (M4-31).
  UPDATE_RUN_STATE_CANCELLED = 10;
}

// UpdateRun is a run of a node.
message UpdateRun {
  // run_id names the run.
  string run_id = 1;
  // node_id is the node.
  string node_id = 2;
  // kind is what it did.
  UpdateRunKind kind = 3;
  // scope is which updates (UPDATE kind only).
  UpdateScope scope = 4;
  // reason is the reason of a reboot.
  string reason = 5;
  // state is where it is.
  UpdateRunState state = 6;
  // exit_code is the command's exit code once it ran.
  optional sint32 exit_code = 7;
  // result_reason explains a refusal or failure (from the host).
  string result_reason = 8;
  // output_truncated: the beginning of the output was cut.
  bool output_truncated = 9;
  // create_time is when the server made it; started and ended are the host's times.
  google.protobuf.Timestamp create_time = 10;
  // start_time is when the host started it.
  google.protobuf.Timestamp start_time = 11;
  // end_time is when it ended.
  google.protobuf.Timestamp end_time = 12;
  // created_by is the user who asked for it (empty: a policy).
  string created_by = 13;
  // output is the end of the run's output (GetUpdateRun only), redacted by the agent.
  string output = 14;
}

// ListUpdateRunsRequest names the node.
message ListUpdateRunsRequest {
  // node_id is the node UUID.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
  // page_size is how many runs, 0 means 20, at most 100.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

// ListUpdateRunsResponse lists the runs.
message ListUpdateRunsResponse {
  // runs are newest first.
  repeated UpdateRun runs = 1;
}

// GetUpdateRunRequest names the run.
message GetUpdateRunRequest {
  // run_id names the run.
  string run_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetUpdateRunResponse is the run with its output.
message GetUpdateRunResponse {
  // run with output.
  UpdateRun run = 1;
}

// RolloutState is where a rollout stands.
enum RolloutState {
  // ROLLOUT_STATE_UNSPECIFIED is not used.
  ROLLOUT_STATE_UNSPECIFIED = 0;
  // ROLLOUT_STATE_RUNNING moves its nodes on.
  ROLLOUT_STATE_RUNNING = 1;
  // ROLLOUT_STATE_DONE: all its nodes are through.
  ROLLOUT_STATE_DONE = 2;
  // ROLLOUT_STATE_STOPPED at a failure (stopOnFailure).
  ROLLOUT_STATE_STOPPED = 3;
}

// RolloutNodeState is where a node of a rollout stands.
enum RolloutNodeState {
  // ROLLOUT_NODE_STATE_UNSPECIFIED is not used.
  ROLLOUT_NODE_STATE_UNSPECIFIED = 0;
  // ROLLOUT_NODE_STATE_WAITING for its turn.
  ROLLOUT_NODE_STATE_WAITING = 1;
  // ROLLOUT_NODE_STATE_UPDATING installs the updates.
  ROLLOUT_NODE_STATE_UPDATING = 2;
  // ROLLOUT_NODE_STATE_REBOOTING reboots.
  ROLLOUT_NODE_STATE_REBOOTING = 3;
  // ROLLOUT_NODE_STATE_HEALTH_CHECK waits for the node to be back and healthy.
  ROLLOUT_NODE_STATE_HEALTH_CHECK = 4;
  // ROLLOUT_NODE_STATE_DONE: through.
  ROLLOUT_NODE_STATE_DONE = 5;
  // ROLLOUT_NODE_STATE_FAILED: its update, reboot or health check failed; reason says why.
  ROLLOUT_NODE_STATE_FAILED = 6;
  // ROLLOUT_NODE_STATE_SKIPPED: not updated; reason says why.
  ROLLOUT_NODE_STATE_SKIPPED = 7;
  // ROLLOUT_NODE_STATE_AGENT_UPDATING: its agent updates itself first (M4-19).
  ROLLOUT_NODE_STATE_AGENT_UPDATING = 8;
}

// RolloutNode is a node of a rollout.
message RolloutNode {
  // node_id is the node.
  string node_id = 1;
  // hostname is its host name when the rollout began.
  string hostname = 2;
  // state is where it stands.
  RolloutNodeState state = 3;
  // reason explains a failure or a skip.
  string reason = 4;
  // update_run_id and reboot_run_id name its runs.
  string update_run_id = 5;
  // reboot_run_id names its reboot run.
  string reboot_run_id = 6;
  // agent_run_id names its self-update run (M4-19).
  string agent_run_id = 7;
}

// Rollout is the run of a group's policy in one window, or a rollout by hand.
message Rollout {
  // rollout_id names it.
  string rollout_id = 1;
  // group_id and group_name are its group.
  string group_id = 2;
  // group_name is the group's name.
  string group_name = 3;
  // manual: started by hand.
  bool manual = 4;
  // state is where it stands; reason says why it stopped.
  RolloutState state = 5;
  // reason says why it stopped.
  string reason = 6;
  // window_start and window_end bound when nodes may start.
  google.protobuf.Timestamp window_start = 7;
  // window_end ends the starts of new nodes.
  google.protobuf.Timestamp window_end = 8;
  // nodes in their order.
  repeated RolloutNode nodes = 9;
}

// ListRolloutsRequest bounds the list.
message ListRolloutsRequest {
  // page_size is how many rollouts, 0 means 20, at most 50.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 50
  }];
}

// ListRolloutsResponse lists the rollouts.
message ListRolloutsResponse {
  // rollouts are newest first.
  repeated Rollout rollouts = 1;
}

// UpdateScope is which updates a run by hand installs.
enum UpdateScope {
  // UPDATE_SCOPE_UNSPECIFIED is invalid.
  UPDATE_SCOPE_UNSPECIFIED = 0;
  // UPDATE_SCOPE_SECURITY installs the security updates (on Alpine nothing: no metadata).
  UPDATE_SCOPE_SECURITY = 1;
  // UPDATE_SCOPE_ALL installs all updates.
  UPDATE_SCOPE_ALL = 2;
}

// StartUpdatesRequest names the nodes and what to install.
message StartUpdatesRequest {
  // node_ids are the nodes, 1 to 100.
  repeated string node_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // scope is which updates to install.
  UpdateScope scope = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // reboot reboots afterwards where needed and allowed.
  bool reboot = 3;
}

// StartUpdatesResponse names the rollouts.
message StartUpdatesResponse {
  // rollout_ids are the rollouts started, one per group.
  repeated string rollout_ids = 1;
}

// RebootNodesRequest names the nodes and the reason.
message RebootNodesRequest {
  // node_ids are the nodes, 1 to 100.
  repeated string node_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // reason is shown to the host's users and in its journal: 1 to 200 bytes, no control, format
  // or separator characters (bidi overrides, zero width).
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 200
    pattern: "^[^\\p{Cc}\\p{Cf}\\p{Zl}\\p{Zp}]*$"
  }];
}

// RebootNodesResponse names the runs.
message RebootNodesResponse {
  // run_ids are the reboot runs, in the order of the nodes.
  repeated string run_ids = 1;
}

// CancelRolloutRequest names the rollout.
message CancelRolloutRequest {
  // rollout_id is the rollout UUID.
  string rollout_id = 1 [(buf.validate.field).string.uuid = true];
}

// CancelRolloutResponse has no fields.
message CancelRolloutResponse {}

// CancelRunRequest names the run.
message CancelRunRequest {
  // run_id is the run UUID.
  string run_id = 1 [(buf.validate.field).string.uuid = true];
}

// CancelRunResponse has no fields.
message CancelRunResponse {}

// RefreshUpdateInfoRequest names the node.
message RefreshUpdateInfoRequest {
  // node_id is the node UUID.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
}

// RefreshUpdateInfoResponse has no fields.
message RefreshUpdateInfoResponse {}

// UpdateAvailability says whether the agent could list the updates.
enum UpdateAvailability {
  // UPDATE_AVAILABILITY_UNSPECIFIED: no report.
  UPDATE_AVAILABILITY_UNSPECIFIED = 0;
  // UPDATE_AVAILABILITY_LISTED: the packages are the host's updates.
  UPDATE_AVAILABILITY_LISTED = 1;
  // UPDATE_AVAILABILITY_NO_HELPER: the root helper is not installed or not running.
  UPDATE_AVAILABILITY_NO_HELPER = 2;
  // UPDATE_AVAILABILITY_HELPER_TOO_OLD: the helper doesn't know the operation.
  UPDATE_AVAILABILITY_HELPER_TOO_OLD = 3;
  // UPDATE_AVAILABILITY_UNSUPPORTED: no supported package manager on the host.
  UPDATE_AVAILABILITY_UNSUPPORTED = 4;
  // UPDATE_AVAILABILITY_FAILED: listing failed; reason says why.
  UPDATE_AVAILABILITY_FAILED = 5;
}

// PackageManager is how the updates were listed.
enum PackageManager {
  // PACKAGE_MANAGER_UNSPECIFIED: unknown.
  PACKAGE_MANAGER_UNSPECIFIED = 0;
  // PACKAGE_MANAGER_APT: Debian and Ubuntu.
  PACKAGE_MANAGER_APT = 1;
  // PACKAGE_MANAGER_DNF: the RHEL family and Fedora.
  PACKAGE_MANAGER_DNF = 2;
  // PACKAGE_MANAGER_APK: Alpine, without security metadata (KONZEPT O6).
  PACKAGE_MANAGER_APK = 3;
}

// GetNodeUpdatesRequest names the node.
message GetNodeUpdatesRequest {
  // node_id is the node UUID.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetNodeUpdatesResponse is the node with its report.
message GetNodeUpdatesResponse {
  // node is the node's status and counts.
  NodeUpdates node = 1;
  // packages are the available updates, security updates first, at most 5000 (fewer than
  // node.total_count if packages_omitted).
  repeated UpdatePackage packages = 2;
  // agent is the node's agent and its channel's release (M4-19).
  AgentInfo agent = 3;
}

// ListFleetUpdatesRequest has no fields yet.
message ListFleetUpdatesRequest {}

// ListFleetUpdatesResponse is the overview.
message ListFleetUpdatesResponse {
  // nodes are the visible nodes, by host name.
  repeated NodeUpdates nodes = 1;
  // unknown counts the nodes without report.
  int32 unknown = 2;
  // unavailable counts the nodes whose agent couldn't list.
  int32 unavailable = 3;
  // current counts the nodes with nothing to update.
  int32 current = 4;
  // with_updates counts the nodes with updates, none for security.
  int32 with_updates = 5;
  // with_security counts the nodes with security updates.
  int32 with_security = 6;
  // reboot_required counts the nodes that need a reboot.
  int32 reboot_required = 7;
}

// NodeUpdates is a node with the counts of its latest report.
message NodeUpdates {
  // node_id is the node UUID.
  string node_id = 1;
  // hostname is the host name from the agent.
  string hostname = 2;
  // group_id is the node group.
  string group_id = 3;
  // status sums the report up.
  UpdateStatus status = 4;
  // availability says whether the agent could list (UNSPECIFIED without report).
  UpdateAvailability availability = 5;
  // reason explains an availability other than listed, or what limits a listing.
  string reason = 6;
  // package_manager says how the updates were listed.
  PackageManager package_manager = 7;
  // collected_at is when the agent listed (its clock).
  google.protobuf.Timestamp collected_at = 8;
  // received_at is when the server stored the report.
  google.protobuf.Timestamp received_at = 9;
  // total_count counts all available updates.
  uint32 total_count = 10;
  // security_count counts the security updates (0 without security metadata, Alpine).
  uint32 security_count = 11;
  // packages_omitted: fewer packages are stored than total_count (the agent's or the
  // organization's limit).
  bool packages_omitted = 12;
  // reboot_required: the host needs a reboot to use what is installed.
  bool reboot_required = 13;
  // reboot_reason names e.g. the packages that asked for the reboot.
  string reboot_reason = 14;
  // last_upgrade_at is when packages were last upgraded, if known.
  google.protobuf.Timestamp last_upgrade_at = 15;
  // oldest_security_since is when the oldest open security update was first reported.
  google.protobuf.Timestamp oldest_security_since = 16;
  // permissions are what the host allows remotely (/etc/sermon/helper.toml); unset without helper.
  HostUpdatePermissions permissions = 17;
  // refreshed: the package sources were updated just before listing.
  bool refreshed = 18;
}

// UpdatePackage is one available update.
message UpdatePackage {
  // name is the package's name.
  string name = 1;
  // installed_version is the version installed now (empty if the package manager doesn't say).
  string installed_version = 2;
  // candidate_version is the version the update installs.
  string candidate_version = 3;
  // source is where it comes from, e.g. "bookworm-security" or a repository's ID.
  string source = 4;
  // security: the source marks it as a security update.
  bool security = 5;
  // first_seen_at is when a report first listed this update.
  google.protobuf.Timestamp first_seen_at = 6;
}

// HostUpdatePermissions are the switches of the host's /etc/sermon/helper.toml (ADR 0035); the
// server can't change them.
message HostUpdatePermissions {
  // remote_updates: updates may be installed on request of the server.
  bool remote_updates = 1;
  // remote_reboot: the host may be rebooted on request of the server.
  bool remote_reboot = 2;
  // self_update: the agent may replace its binary on request of the server.
  bool self_update = 3;
}
