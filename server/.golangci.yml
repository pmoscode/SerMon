# golangci-lint v2 configuration – run with `just lint-server`.
version: "2"

run:
  timeout: 5m
  build-tags: [integration] # lint integration tests too

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    gosec:
      excludes: []
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
      context: scope
    wrapcheck:
      # Domain packages return sentinel errors meant to be passed through unchanged.
      ignore-package-globs:
        - github.com/pmoscode/SerMon/server/internal/domain/*
      ignore-sig-regexps:
        - '\.Errorf\('
        - 'connect\.NewError\(' # Connect status errors are the API's error values
        - 'errors\.Join\('
  exclusions:
    # Generated by `just gen` (buf) – never edited by hand.
    paths:
      - internal/gen
      - internal/adapters/postgres/sqlcdb # generated by sqlc
    rules:
      # Test code may ignore errors of best-effort cleanup and returns from helpers.
      - path: _test\.go
        linters: [wrapcheck, errcheck, gosec, bodyclose]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pmoscode/SerMon/server
