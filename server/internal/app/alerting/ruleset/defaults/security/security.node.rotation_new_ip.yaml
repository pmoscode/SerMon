apiVersion: sermon/v1
kind: AlertRule
metadata:
  id: security.node.rotation_new_ip
  name: { de: "Schlüsselrotation von neuer Adresse", en: "Key rotation from a new address" }
  labels: { category: security }
spec:
  type: event
  event: node.rotation_new_ip
  count: { window: 15m, warning: 1 }
  notifyFields: [ ts, ip, previous_ip ]
  help:
    de: >-
      Ein Agent hat sein Zertifikat von einer anderen Adresse erneuert, als er zuletzt verbunden war. Nach einem
      Wechsel des Netzes oder einer neuen öffentlichen IP ist das normal; unerwartet kann es heißen, dass der
      Schlüssel auf einem anderen Rechner benutzt wird. Prüfe, ob die neue Adresse zum Host passt; bei Zweifel den
      Schlüssel widerrufen und den Agent neu installieren (Node, Reiter Identität).
    en: >-
      An agent renewed its certificate from another address than its last session. After a change of network or a
      new public IP that is normal; unexpected, it can mean the key is used on another machine. Check whether the new
      address fits the host; if in doubt revoke the key and install the agent again (node, Identity tab).
